<main id="content" tabindex="-1"><header class="topbar"><span>工作区 <span class="crumb-sep">/</span> <b id="breadcrumb">运行总览</b></span><div class="topbar-meta"><span class="badge" id="source-badge">离线 C 回放</span><span class="topbar-node">支管 A</span></div></header><div class="page-heading"><div><p class="eyebrow" id="eyebrow">WORKSPACE</p><h1 id="page-title">运行总览</h1><p id="page-description">从当前状态出发，安排支管核查与下一步工作。</p></div><span class="heading-mark" aria-hidden="true">A<span>01</span></span></div>
<details id="replay-panel" class="source-panel"><summary><span class="source-symbol" aria-hidden="true">◉</span><span><b id="source-title">离线合成回放</b><span id="context-summary">渐进等效泄漏 · 450 s</span></span><span class="context-action">回放控制 <span aria-hidden="true">⌄</span></span></summary><section class="source-bar" aria-label="数据来源与回放控制"><p id="source-detail">编译后 C 输出；非实物测量。</p><div class="source-controls"><label>场景<select id="scene"><option value="leak">渐进等效泄漏</option><option value="restriction">渐进等效受限</option><option value="normal">正常支路切换</option><option value="supply">供压变化</option><option value="drift">入口压力漂移</option><option value="pulse">8 秒短时异常</option><option value="missing">压力缺测</option><option value="range">压力越界</option><option value="counter">脉冲计数复位</option></select></label><label>压力噪声 σ<select id="noise"><option value="0.3">0.3 kPa</option><option value="3">3 kPa</option><option value="10">10 kPa</option></select></label><button id="backend-connect">连接本地后端</button></div><div class="cursor"><label for="timeline">回放位置 <b id="cursor-label">450 s</b></label><input id="timeline" type="range" min="0" max="600" value="450"><button id="advance">推进 30 秒</button><button id="new-run" hidden>新建会话</button></div></section></details>
<div id="error" role="alert" hidden></div><div id="page-body"></div><footer><span id="footer-source">C 主窗 10 s · 短窗 3 s</span><span>候选模式用于核查，需结合独立参考测量。</span></footer></main>
