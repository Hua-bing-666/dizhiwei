<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>滴智卫 · 支管运行平台</title><style>__PLATFORM_CSS__</style></head><body>
<a class="skip" href="#content">跳到主要内容</a><aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark">滴</span><span>滴智卫<small>DRIP OPERATIONS</small></span></a><div class="workspace"><b>支管 A · 本地工作区</b><span>南疆棉田滴灌巡检原型</span></div><p class="nav-label">运行与维护</p><nav aria-label="系统功能"><button data-page="overview">运行总览</button><button data-page="monitor">支管监测</button><button data-page="events">异常事件</button><button data-page="devices">设备与链路</button><button data-page="history">历史记录</button><button data-page="settings">系统设置</button></nav><div class="sidebar-foot"><span class="dot"></span> LoRa 实物尚未接入</div></aside>
<main id="content" tabindex="-1"><header class="topbar"><span>滴灌运行平台 / <b id="breadcrumb">运行总览</b></span><span class="badge" id="source-badge">合成 C 回放</span></header><div class="page-heading"><div><p class="eyebrow" id="eyebrow">OVERVIEW</p><h1 id="page-title">运行总览</h1><p id="page-description">查看支管变化与需要核查的线索。</p></div><button id="export">导出当前记录 ↗</button></div>
<section class="source-bar" aria-label="数据来源与回放控制"><div><b id="source-title">离线合成回放</b><p id="source-detail">C 诊断输出；非实物测量。</p></div><div class="source-controls"><label>场景<select id="scene"><option value="leak">渐进等效泄漏</option><option value="restriction">渐进等效受限</option><option value="normal">正常支路切换</option><option value="supply">供压变化</option><option value="drift">入口压力漂移</option><option value="pulse">8 秒短时异常</option><option value="missing">压力缺测</option><option value="range">压力越界</option><option value="counter">脉冲计数复位</option></select></label><label>压力噪声 σ<select id="noise"><option value="0.3">0.3 kPa</option><option value="3">3 kPa</option><option value="10">10 kPa</option></select></label><button id="backend-connect">连接本地后端</button></div></section>
<div id="error" role="alert" hidden></div><div class="cursor"><label for="timeline">回放位置 <b id="cursor-label">450 s</b></label><input id="timeline" type="range" min="0" max="600" value="450"><button id="advance">推进 30 秒</button><button id="new-run" hidden>新建会话</button></div>
<div id="page-body"></div><footer><span id="footer-source">C 主窗 10 s · 短窗 3 s</span><span>候选模式用于核查，不能代替独立参考测量。</span></footer></main>
<dialog id="event-dialog"><form id="event-form"><header><h2>事件核查</h2><button type="button" id="dialog-close" aria-label="关闭">×</button></header><div id="event-summary"></div><label>核查状态<select id="event-stage"><option value="viewed">已查看</option><option value="pending_recheck">待复测</option><option value="needs_check">继续检查</option><option value="archived">人工归档</option></select></label><label>核查与复测依据<textarea id="event-note" rows="4" maxlength="2000" required placeholder="填写本次检查的工况、操作与参考测量；演示记录请注明。"></textarea></label><label>复测依据（人工归档时必填）<textarea id="event-proof" rows="2" maxlength="2000" placeholder="填写同工况参考测量与复测记录；软件演示请明确注明。"></textarea></label><div id="event-message" role="alert"></div><div id="event-history"></div><button type="submit" class="primary">保存核查记录</button></form></dialog><div id="toast" role="status"></div>
<script>const PLATFORM_DATA=__PLATFORM_DATA__;</script><script>__PLATFORM_JS__</script></body></html>
