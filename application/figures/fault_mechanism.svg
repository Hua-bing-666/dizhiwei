<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M2 1 L8 4.5 L2 8" fill="none" stroke="#5f5e5a" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="arc" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M2 1 L8 4.5 L2 8" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-linecap="round"/></marker><marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M2 1 L8 4.5 L2 8" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linecap="round"/></marker></defs><rect width="1000" height="470" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="#3c3c3a"><rect x="30" y="40" width="440" height="390" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="250" y="80" font-size="26" font-weight="700" text-anchor="middle" fill="#993C1D">等效泄漏（旁路放水）</text><path d="M 60 150 L 440 150" fill="none" stroke="#5f5e5a" stroke-width="4" marker-end="url(#ar)"/><text x="90" y="136" font-size="21" fill="#7a7a78">来水</text><text x="390" y="136" font-size="21" fill="#7a7a78">下游负载</text><path d="M 230 150 L 230 220" fill="none" stroke="#993C1D" stroke-width="3"/><rect x="198" y="220" width="64" height="30" rx="6" fill="white" stroke="#993C1D" stroke-width="1.5"/><text x="230" y="241" font-size="20" text-anchor="middle" dominant-baseline="central">泄漏阀</text><text x="270" y="214" font-size="20" fill="#993C1D">旁路跑水 → 总流量增大</text><circle cx="150" cy="150" r="20" fill="white" stroke="#5f5e5a" stroke-width="2"/><text x="150" y="157" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">Q</text><circle cx="330" cy="150" r="20" fill="white" stroke="#5f5e5a" stroke-width="2"/><text x="330" y="157" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">ΔP</text><text x="60" y="292" font-size="23" font-weight="700">三通道响应：</text><text x="60" y="330" font-size="23">Q ↑（含泄漏量）　ΔP ≈ 不变</text><image href="math/eq_K.png" x="60" y="344" width="166" height="46"/><text x="236" y="376" font-size="23" fill="#993C1D" font-weight="700">↑　Rh ≈ 不变</text><rect x="530" y="40" width="440" height="390" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/><text x="750" y="80" font-size="26" font-weight="700" text-anchor="middle" fill="#3B6D11">等效受限（孔板收缩）</text><path d="M 560 150 L 940 150" fill="none" stroke="#5f5e5a" stroke-width="4" marker-end="url(#ar)"/><text x="590" y="136" font-size="21" fill="#7a7a78">来水</text><text x="890" y="136" font-size="21" fill="#7a7a78">下游负载</text><path d="M 690 150 L 715 138 L 745 138 L 770 150" fill="none" stroke="#3B6D11" stroke-width="3"/><text x="730" y="124" font-size="20" text-anchor="middle" fill="#3B6D11">孔板 + 针阀</text><text x="780" y="184" font-size="20" fill="#3B6D11">区段阻力增大 → 压降增大</text><circle cx="650" cy="150" r="20" fill="white" stroke="#5f5e5a" stroke-width="2"/><text x="650" y="157" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">Q</text><circle cx="830" cy="150" r="20" fill="white" stroke="#5f5e5a" stroke-width="2"/><text x="830" y="157" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">ΔP</text><text x="560" y="292" font-size="23" font-weight="700">三通道响应：</text><text x="560" y="330" font-size="23">Q ≈ 不变　ΔP ↑</text><image href="math/eq_Rh.png" x="560" y="344" width="140" height="44"/><text x="710" y="376" font-size="23" fill="#3B6D11" font-weight="700">↑　K ≈ 不变</text><text x="500" y="462" font-size="23" fill="#7a7a78" text-anchor="middle">两类故障在特征空间中方向相反：K 通道管泄漏，Rh 通道管受限 —— 互不混叠</text></g></svg>