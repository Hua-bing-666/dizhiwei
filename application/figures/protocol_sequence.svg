<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black"/></marker></defs><rect width="1000" height="580" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="black"><g data-kind="box" data-x="20" data-y="20" data-w="220" data-h="54"><rect x="20" y="20" width="220" height="54" fill="white" stroke="black" stroke-width="2"/><text x="130.0" y="55.5" font-size="25" font-weight="700" text-anchor="middle">感知节点</text></g><path d="M 130 74 L 130 530" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><g data-kind="box" data-x="390" data-y="20" data-w="220" data-h="54"><rect x="390" y="20" width="220" height="54" fill="white" stroke="black" stroke-width="2"/><text x="500.0" y="55.5" font-size="25" font-weight="700" text-anchor="middle">LoRa接收端</text></g><path d="M 500 74 L 500 530" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><g data-kind="box" data-x="760" data-y="20" data-w="220" data-h="54"><rect x="760" y="20" width="220" height="54" fill="white" stroke="black" stroke-width="2"/><text x="870.0" y="55.5" font-size="25" font-weight="700" text-anchor="middle">本地数据库</text></g><path d="M 870 74 L 870 530" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><path d="M 130 140 L 500 140" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="315.0" y="124" font-size="23" font-weight="400" text-anchor="middle">① 事件：设备 / 会话 / 序号</text><path d="M 500 210 L 870 210" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="685.0" y="194" font-size="23" font-weight="400" text-anchor="middle">② 新事件持久化 / 重复去重</text><path d="M 870 280 L 500 280" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="685.0" y="264" font-size="23" font-weight="400" text-anchor="middle">③ 写入成功或已存在</text><path d="M 500 350 L 130 350" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="315.0" y="334" font-size="23" font-weight="400" text-anchor="middle">④ 匹配ACK，节点再移除队列项</text><path d="M 130 425 L 500 425" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="315" y="409" font-size="23" font-weight="400" text-anchor="middle">ACK丢失：超时后重发同一事件</text><path d="M 500 492 L 130 492" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="315" y="476" font-size="23" font-weight="400" text-anchor="middle">已存重复事件仍回复ACK</text><text x="24" y="560" font-size="23" font-weight="400" text-anchor="start">拟实施交互；失败保留待确认状态。ACK表示已存储，人工处理确认另记。</text></g></svg>
