<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#156078"/></marker></defs><rect width="1200" height="610" fill="#f7f9fa"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#22343e"><text x="42" y="53" font-size="27" font-weight="bold">测点位置决定可观测性：必须在小试中对照</text><text x="42" y="89" font-size="17" fill="#974518">拟定设计 · 尚未搭建 · 图中上/下游均相对压力测点 P</text>
<text x="42" y="145" font-size="20" font-weight="bold">原仿真：节流在 P 测点上游</text><g stroke="#156078" stroke-width="5" marker-end="url(#a)"><path d="M170,207 H1090"/></g><g fill="#fff" stroke="#b9ced6" stroke-width="2"><rect x="42" y="176" width="140" height="62" rx="9"/><rect x="290" y="176" width="145" height="62" rx="9"/><rect x="570" y="176" width="135" height="62" rx="9"/><rect x="820" y="176" width="245" height="62" rx="9"/></g><g font-size="19" text-anchor="middle"><text x="112" y="215">供水 / Q</text><text x="362" y="215">增加节流</text><text x="637" y="215">P 测点</text><text x="942" y="215">支路阻力＋等效出流</text></g><text x="42" y="273" font-size="17">上游节流压降与供源降压可产生相同 P/Q；不保证原因分类。</text>
<text x="42" y="328" font-size="20" font-weight="bold">正式小试需另测：节流在 P 测点下游</text><g stroke="#156078" stroke-width="5" marker-end="url(#a)"><path d="M170,390 H1090"/></g><g fill="#fff" stroke="#b9ced6" stroke-width="2"><rect x="42" y="359" width="140" height="62" rx="9"/><rect x="290" y="359" width="145" height="62" rx="9"/><rect x="570" y="359" width="135" height="62" rx="9"/><rect x="820" y="359" width="245" height="62" rx="9"/></g><g font-size="19" text-anchor="middle"><text x="112" y="399">供水 / Q</text><text x="362" y="399">P 测点</text><text x="637" y="399">增加节流</text><text x="942" y="399">等效出流 / 滴灌带</text></g><text x="42" y="456" font-size="17">下游节流、不同供压与滴头类型可能改变响应；当前原示例没有验证这一配置。</text>
<text x="42" y="525" font-size="19" font-weight="bold">小试记录：Q计量边界、P位置、泄漏位置、阀态/泵态、独立出水参考</text><text x="42" y="560" font-size="17" fill="#5b6a73">可借第二压力测点比较上下游与供压参考；是否纳入最终原型需按成本和增量决定。</text></g></svg>
