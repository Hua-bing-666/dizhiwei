<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black"/></marker></defs><rect width="1000" height="950" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="black"><g data-kind="box" data-x="40" data-y="16" data-w="515" data-h="85"><rect x="40" y="16" width="515" height="85" fill="white" stroke="black" stroke-width="2"/><text x="297.5" y="52.0" font-size="25" font-weight="700" text-anchor="middle">接收质量有效且状态明确的数据</text><text x="297.5" y="83.0" font-size="23" font-weight="400" text-anchor="middle">采用已冻结的同工况健康参照</text></g><path d="M 297 101 L 297 119" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 297 119.0 L 542.0 174 L 297 229.0 L 52.0 174 Z" fill="white" stroke="black" stroke-width="2"/><text x="297" y="167.5" font-size="23" font-weight="400" text-anchor="middle">Q、P1及健康压降满足</text><text x="297" y="196.5" font-size="23" font-weight="400" text-anchor="middle">本次试验的可计算条件？</text><path d="M 542 174 L 652 174" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="583.5" y="141" width="33" height="28" fill="white"/><text x="600" y="163" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="652" data-y="132" data-w="320" data-h="85"><rect x="652" y="132" width="320" height="85" fill="white" stroke="black" stroke-width="2"/><text x="812.0" y="168.0" font-size="25" font-weight="700" text-anchor="middle">不可可靠解释</text><text x="812.0" y="199.0" font-size="23" font-weight="400" text-anchor="middle">记录低流量或压差不足</text></g><path d="M 297 229 L 297 258" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="310.5" y="228" width="33" height="28" fill="white"/><text x="327" y="250" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="40" data-y="258" data-w="515" data-h="114"><rect x="40" y="258" width="515" height="114" fill="white" stroke="black" stroke-width="2"/><text x="297.5" y="293.5" font-size="25" font-weight="700" text-anchor="middle">计算特征并记录不确定度</text><text x="297.5" y="324.5" font-size="23" font-weight="400" text-anchor="middle">K = Q/√P1；R̂ = (P0−P1)/Q²</text><text x="297.5" y="354.5" font-size="23" font-weight="400" text-anchor="middle">比较同工况健康特征与误差区间</text></g><path d="M 297 372 L 297 399" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 297 399.0 L 542.0 458 L 297 517.0 L 52.0 458 Z" fill="white" stroke="black" stroke-width="2"/><text x="297" y="451.5" font-size="23" font-weight="400" text-anchor="middle">偏离超过冻结判据，</text><text x="297" y="480.5" font-size="23" font-weight="400" text-anchor="middle">并满足持续条件？</text><path d="M 542 458 L 652 458" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="583.5" y="424" width="33" height="28" fill="white"/><text x="600" y="446" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="652" data-y="414" data-w="320" data-h="88"><rect x="652" y="414" width="320" height="88" fill="white" stroke="black" stroke-width="2"/><text x="812.0" y="451.5" font-size="25" font-weight="700" text-anchor="middle">当前未形成可靠异常</text><text x="812.0" y="482.5" font-size="23" font-weight="400" text-anchor="middle">继续采样；保留趋势与日志</text></g><path d="M 297 517 L 297 546" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="310.5" y="516" width="33" height="28" fill="white"/><text x="327" y="538" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="40" data-y="546" data-w="515" data-h="114"><rect x="40" y="546" width="515" height="114" fill="white" stroke="black" stroke-width="2"/><text x="297.5" y="581.5" font-size="25" font-weight="700" text-anchor="middle">检查模式与适用条件</text><text x="297.5" y="612.5" font-size="23" font-weight="400" text-anchor="middle">K偏离 / R̂偏离 / 运行状态</text><text x="297.5" y="642.5" font-size="23" font-weight="400" text-anchor="middle">偏置、未知负载与混合变化另行核查</text></g><path d="M 297 660 L 297 687" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 297 687.0 L 542.0 742 L 297 797.0 L 52.0 742 Z" fill="white" stroke="black" stroke-width="2"/><text x="297" y="735.5" font-size="23" font-weight="400" text-anchor="middle">单一模式证据足够，</text><text x="297" y="764.5" font-size="23" font-weight="400" text-anchor="middle">且符合标定与状态条件？</text><path d="M 542 742 L 652 742" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="583.5" y="708" width="33" height="28" fill="white"/><text x="600" y="730" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="652" data-y="699" data-w="320" data-h="85"><rect x="652" y="699" width="320" height="85" fill="white" stroke="black" stroke-width="2"/><text x="812.0" y="735.0" font-size="25" font-weight="700" text-anchor="middle">异常待检查</text><text x="812.0" y="766.0" font-size="23" font-weight="400" text-anchor="middle">保存证据；不指定唯一原因</text></g><path d="M 297 797 L 297 824" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="310.5" y="794" width="33" height="28" fill="white"/><text x="327" y="816" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="40" data-y="824" data-w="515" data-h="85"><rect x="40" y="824" width="515" height="85" fill="white" stroke="black" stroke-width="2"/><text x="297.5" y="860.0" font-size="25" font-weight="700" text-anchor="middle">汇总提示与事件证据</text><text x="297.5" y="891.0" font-size="23" font-weight="400" text-anchor="middle">有限模式或待检查；保存首次提示时间</text></g><path d="M 972 174 L 988 174 L 988 868 L 555 868" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 972 742 L 988 742" fill="none" stroke="black" stroke-width="2"/><text x="24" y="930" font-size="23" font-weight="400" text-anchor="start">拟实施判据须经标定小试冻结；低压弱异常和原因歧义保留为失败边界。</text></g></svg>
