C45" text-anchor="start" font-weight="bold">有限故障模式</text><text x="631" y="451" font-family="Microsoft YaHei, Arial" font-size="21" fill="#556762">等效泄漏 / 等效受限</text><line x1="543" y1="436" x2="610" y2="436" stroke="#164C45" stroke-width="2"/><polygon points="610,436 600.0950818741205,440.78462087522354 600.0950818741205,431.21537912477646" fill="#164C45" stroke="none" stroke-width="1"/><text x="24" y="535" font-family="Microsoft YaHei, Arial" font-size="22" fill="#556762" text-anchor="start">输出需结合标定、状态和可观测条件；流程为拟实施设计。</text></svg>