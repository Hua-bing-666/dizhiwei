<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" data-classification="candidate_functional_design_not_physical_test"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172b30"/></marker></defs><rect width="1000" height="690" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif"><text x="28" y="48" font-size="30" font-weight="700" text-anchor="start" fill="#142a30">取样与脉冲窗口：可用容量、分辨率和等待</text><text x="28" y="88" font-size="23" font-weight="400" text-anchor="start" fill="#52636a">模型分析；非容器标定或固件测试</text><text x="28" y="143" font-size="26" font-weight="700" text-anchor="start" fill="#142a30">容量需求与候选空腔 / mL</text><text x="28" y="187" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">空腔几何</text><rect x="245" y="166" width="140.56" height="29" fill="#7d9694"/><text x="475" y="187" font-size="24" font-weight="400" text-anchor="end" fill="#142a30">678.6</text><text x="28" y="262" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">75%有效假设</text><rect x="245" y="241" width="105.42" height="29" fill="#a9b7b5"/><text x="475" y="262" font-size="24" font-weight="400" text-anchor="end" fill="#142a30">508.9</text><text x="28" y="337" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">20s + 25%余量</text><rect x="245" y="316" width="91.06" height="29" fill="#476f62"/><text x="475" y="337" font-size="24" font-weight="400" text-anchor="end" fill="#142a30">439.6</text><text x="28" y="412" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">30s + 25%余量</text><rect x="245" y="391" width="136.59" height="29" fill="#a37850"/><text x="475" y="412" font-size="24" font-weight="400" text-anchor="end" fill="#142a30">659.4</text><text x="535" y="143" font-size="26" font-weight="700" text-anchor="start" fill="#142a30">计数窗口与理想步长 / L·min⁻¹</text><text x="535" y="187" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">1秒窗口</text><text x="975" y="187" font-size="26" font-weight="700" text-anchor="end" fill="#142a30">0.11111</text><text x="535" y="218" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">因果窗均值滞后 0.5 秒</text><text x="535" y="262" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">5秒窗口</text><text x="975" y="262" font-size="26" font-weight="700" text-anchor="end" fill="#142a30">0.02222</text><text x="535" y="293" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">因果窗均值滞后 2.5 秒</text><text x="535" y="337" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">10秒窗口</text><text x="975" y="337" font-size="26" font-weight="700" text-anchor="end" fill="#142a30">0.01111</text><text x="535" y="368" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">因果窗均值滞后 5 秒</text><text x="535" y="412" font-size="24" font-weight="400" text-anchor="start" fill="#142a30">20秒窗口</text><text x="975" y="412" font-size="26" font-weight="700" text-anchor="end" fill="#142a30">0.00556</text><text x="535" y="443" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">因果窗均值滞后 10 秒</text><path d="M 505 130 L 505 484" fill="none" stroke="#c6d0d1" stroke-width="2"/><text x="28" y="536" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">拟采用20秒分次取样：先标定有效容积≥440mL，长时实验另设排水。</text><text x="28" y="579" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">75%只是安全液位敏感性假设；30秒要求未扣安全液位，不能直接承诺。</text><text x="28" y="622" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">长计数窗口降低理想步长，却增加滞后；高斯回放未实现脉冲计数。</text><text x="28" y="665" font-size="24" font-weight="400" text-anchor="start" fill="#52636a">不含漏脉冲、抖动或器件误差</text></g></svg>
