<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="785" viewBox="0 0 1000 785" data-classification="candidate_functional_design_not_physical_test"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172b30"/></marker></defs><rect width="1000" height="785" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif"><text x="28" y="48" font-size="30" font-weight="700" text-anchor="start" fill="#142a30">电源与引脚：一节点的资源分配</text><text x="28" y="88" font-size="23" font-weight="400" text-anchor="start" fill="#52636a">电流为设计预留，非实测功耗；主控、ADC与存储使用独立3.3V稳压。</text><text x="243" y="144" font-size="26" font-weight="700" text-anchor="middle" fill="#142a30">节点电源分配</text><g data-box="true" data-x="30" data-y="190" data-w="145" data-h="84"><rect x="30" y="190" width="145" height="84" rx="3" fill="#eef5f2" stroke="#26383d" stroke-width="2"/><text x="102.5" y="224.0" font-size="24" font-weight="700" text-anchor="middle" fill="#142a30">5V入口</text><text x="102.5" y="256.0" font-size="23" font-weight="400" text-anchor="middle" fill="#142a30">候选≥1A</text></g><g data-box="true" data-x="270" data-y="190" data-w="190" data-h="84"><rect x="270" y="190" width="190" height="84" rx="3" fill="#eaf1f7" stroke="#26383d" stroke-width="2"/><text x="365.0" y="224.0" font-size="24" font-weight="700" text-anchor="middle" fill="#142a30">3.3V降压</text><text x="365.0" y="256.0" font-size="23" font-weight="400" text-anchor="middle" fill="#142a30">候选≥1A</text></g><path d="M 175 232 L 270 232" fill="none" stroke="#172b30" stroke-width="2" marker-end="url(#arrow)"/><circle cx="230" cy="232" r="4" fill="#172b30"/><g data-box="true" data-x="30" data-y="360" data-w="190" data-h="124"><rect x="30" y="360" width="190" height="124" rx="3" fill="#eef5f2" stroke="#26383d" stroke-width="2"/><text x="125.0" y="398.0" font-size="24" font-weight="700" text-anchor="middle" fill="#142a30">E220</text><text x="125.0" y="430.0" font-size="23" font-weight="400" text-anchor="middle" fill="#142a30">VCC 5V</text><text x="125.0" y="462.0" font-size="23" font-weight="400" text-anchor="middle" fill="#142a30">IO 3.3V</text></g><g data-box="true" data-x="270" data-y="360" data-w="190" data-h="124"><rect x="270" y="360" width="190" height="124" rx="3" fill="#f8f2e8" stroke="#26383d" stroke-width="2"/><text x="365.0" y="398.0" font-size="24" font-weight="700" text-anchor="middle" fill="#142a30">SEN0549</text><text x="365.0" y="430.0" font-size="23" font-weight="400" text-anchor="middle" fill="#142a30">VCC 5V</text><text x="365.0" y="462.0" font-size="23" font-weight="400" text-anchor="middle" fill="#142a30">经缓冲后计数</text></g><path d="M 102 274 L 102 360" fill="none" stroke="#172b30" stroke-width="2" marker-end="url(#arrow)"/><path d="M 230 232 L 230 330 L 365 330 L 365 360" fill="none" stroke="#172b30" stroke-width="2" marker-end="url(#arrow)"/><path d="M 460 232 L 487 232 L 487 518 L 245 518 L 245 555" fill="none" stroke="#172b30" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="547" font-size="23" font-weight="400" text-anchor="start" fill="#3c6284">3.3V</text><g data-box="true" data-x="30" data-y="555" data-w="430" data-h="105"><rect x="30" y="555" width="430" height="105" rx="3" fill="#eaf1f7" stroke="#26383d" stroke-width="2"/><text x="245.0" y="599.5" font-size="24" font-weight="700" text-anchor="middle" fill="#142a30">主控（内置 ADC）+ microSD</text><text x="245.0" y="631.5" font-size="23" font-weight="400" text-anchor="middle" fill="#142a30">360mA预留，未测瞬态电流</text></g><text x="747" y="144" font-size="26" font-weight="700" text-anchor="middle" fill="#142a30">候选引脚表</text><rect x="530" y="173" width="440" height="482" fill="#fafbfb" stroke="#ccd5d8"/><text x="546" y="208" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">内置 ADC（主路径）</text><text x="774" y="208" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PA0 / PA1</text><path d="M 542 226 L 958 226" fill="none" stroke="#d5dddf" stroke-width="2"/><text x="546" y="265" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">I²C1 总线</text><text x="774" y="265" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PB8 / PB9</text><path d="M 542 283 L 958 283" fill="none" stroke="#d5dddf" stroke-width="2"/><text x="546" y="322" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">流量计数</text><text x="774" y="322" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PB6 / TIM4_CH1</text><path d="M 542 340 L 958 340" fill="none" stroke="#d5dddf" stroke-width="2"/><text x="546" y="379" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">LoRa / UART</text><text x="774" y="379" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PA9 / PA10</text><path d="M 542 397 L 958 397" fill="none" stroke="#d5dddf" stroke-width="2"/><text x="546" y="436" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">microSD / SPI</text><text x="774" y="436" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PA4—PA7</text><path d="M 542 454 L 958 454" fill="none" stroke="#d5dddf" stroke-width="2"/><text x="546" y="493" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">24V 高边开关</text><text x="774" y="493" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PB0</text><path d="M 542 511 L 958 511" fill="none" stroke="#d5dddf" stroke-width="2"/><text x="546" y="550" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">SWD 保留</text><text x="774" y="550" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PA13 / PA14</text><path d="M 542 568 L 958 568" fill="none" stroke="#d5dddf" stroke-width="2"/><text x="546" y="607" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">调试串口</text><text x="774" y="607" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PA2 / PA3</text><text x="28" y="700" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PB8/PB9 总线挂 DS3231 与可选 SGM58031；</text><text x="28" y="733" font-size="23" font-weight="400" text-anchor="start" fill="#142a30">PB1 为人工 B 状态标记，非阀位实测；24 V 仅供两线制变送器。</text><text x="28" y="766" font-size="23" font-weight="400" text-anchor="start" fill="#52636a">USB-TTL 须为 3.3 V 电平；接线前核对稳压/上拉，避免电源回灌。</text></g></svg>
