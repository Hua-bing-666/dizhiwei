<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black"/></marker></defs><rect width="1000" height="590" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="black"><g data-kind="box" data-x="20" data-y="90" data-w="155" data-h="100"><rect x="20" y="90" width="155" height="100" fill="white" stroke="black" stroke-width="2"/><text x="97.5" y="133.5" font-size="25" font-weight="700" text-anchor="middle">可调供水</text><text x="97.5" y="164.5" font-size="23" font-weight="400" text-anchor="middle">工作点待核定</text></g><path d="M 175 140 L 220 140 L 220 106 L 915 106" fill="none" stroke="black" stroke-width="2"/><path d="M 220 140 L 220 300 L 915 300" fill="none" stroke="black" stroke-width="2"/><circle cx="240" cy="106" r="26" fill="white" stroke="black" stroke-width="2"/><text x="240" y="114" font-size="24" font-weight="700" text-anchor="middle">Q</text><text x="240" y="53" font-size="23" font-weight="400" text-anchor="middle">流量计</text><circle cx="350" cy="106" r="26" fill="white" stroke="black" stroke-width="2"/><text x="350" y="114" font-size="24" font-weight="700" text-anchor="middle">P0</text><text x="350" y="53" font-size="23" font-weight="400" text-anchor="middle">取压嘴A</text><circle cx="620" cy="106" r="26" fill="white" stroke="black" stroke-width="2"/><text x="620" y="114" font-size="24" font-weight="700" text-anchor="middle">P1</text><text x="620" y="53" font-size="23" font-weight="400" text-anchor="middle">取压嘴B</text><g data-kind="box" data-x="400" data-y="79" data-w="145" data-h="54"><rect x="400" y="79" width="145" height="54" fill="white" stroke="black" stroke-width="2"/><text x="472.5" y="114.5" font-size="25" font-weight="700" text-anchor="middle">区段R</text></g><g data-kind="box" data-x="815" data-y="79" data-w="145" data-h="54"><rect x="815" y="79" width="145" height="54" fill="white" stroke="black" stroke-width="2"/><text x="887.5" y="114.5" font-size="25" font-weight="700" text-anchor="middle">A正常负载</text></g><path d="M 690 106 L 690 205 L 970 205" fill="none" stroke="black" stroke-width="2"/><g data-kind="box" data-x="815" data-y="178" data-w="145" data-h="54"><rect x="815" y="178" width="145" height="54" fill="white" stroke="black" stroke-width="2"/><text x="887.5" y="213.5" font-size="25" font-weight="700" text-anchor="middle">泄漏球阀</text></g><text x="817" y="269" font-size="23" font-weight="400" text-anchor="middle">独立收集量与计时</text><g data-kind="box" data-x="362" data-y="273" data-w="145" data-h="54"><rect x="362" y="273" width="145" height="54" fill="white" stroke="black" stroke-width="2"/><text x="434.5" y="308.5" font-size="25" font-weight="700" text-anchor="middle">B切换阀</text></g><g data-kind="box" data-x="815" data-y="273" data-w="145" data-h="54"><rect x="815" y="273" width="145" height="54" fill="white" stroke="black" stroke-width="2"/><text x="887.5" y="308.5" font-size="25" font-weight="700" text-anchor="middle">B正常负载</text></g><text x="569" y="348" font-size="23" font-weight="400" text-anchor="middle">B模拟共同供水下的正常负载切换</text><path d="M 960 106 L 980 106 L 980 385 L 220 385 L 220 430" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 960 300 L 980 300" fill="none" stroke="black" stroke-width="2"/><g data-kind="box" data-x="70" data-y="430" data-w="350" data-h="90"><rect x="70" y="430" width="350" height="90" fill="white" stroke="black" stroke-width="2"/><text x="245.0" y="468.5" font-size="25" font-weight="700" text-anchor="middle">回水或收集装置</text><text x="245.0" y="499.5" font-size="23" font-weight="400" text-anchor="middle">泄漏支路收集后另行回水</text></g><path d="M 70 461 L 12 461 L 12 140 L 20 140" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="24" y="539" font-size="23" font-weight="400" text-anchor="start">安装顺序：流量计 → 取压嘴A → 区段R → 取压嘴B → 泄漏球阀，不可调换。</text><text x="24" y="570" font-size="23" font-weight="400" text-anchor="start">两个取压嘴都在流量计下游；接头、稳压、排气和防溅措施须在装配前核定。</text></g></svg>
