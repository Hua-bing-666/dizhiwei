<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1460" viewBox="0 0 1160 1460" role="img" aria-labelledby="title desc">
<title id="title">支管故障块CUSUM诊断流程</title>
<desc id="desc">独立健康标定支路向在线监测提供参照和尺度。每秒采集，十秒不重叠块，数据检查，双残差标准化，双通道单侧CUSUM递推与候选分类；无效、未越限及事件记录后均返回采集。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#111"/></marker></defs>
<rect width="1160" height="1460" fill="white"/>
<g fill="#111"><path class="connector" d="M600 72 L600 103" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M600 169 L600 202" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M600 284 L600 315" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M600 393 L600 421" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M600 561 L600 594" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M790 491 L900 491" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M1125 491 L1140 491" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M600 684 L600 720" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M160 284 L160 315" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M160 465 L160 775 L350 775" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M600 830 L600 865" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M600 967 L600 1000" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M790 1057 L1140 1057" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M600 1114 L600 1150" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M190 1150 L970 1150" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M190 1150 L190 1190" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M580 1150 L580 1190" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M970 1150 L970 1190" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M190 1278 L190 1312" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M580 1278 L580 1312" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M970 1278 L970 1312" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M190 1312 L970 1312" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter"/><path class="connector" d="M600 1312 L600 1340" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><path class="connector" d="M900 1384 L1140 1384 L1140 187 L600 187 L600 202" fill="none" stroke="#111" stroke-width="1.55" stroke-linejoin="miter" marker-end="url(#arrow)"/><g data-node="start" data-x="525" data-y="24" data-w="150" data-h="48"><rect x="525" y="24" width="150" height="48" rx="24" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="48.0" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">开始</text></g><g data-node="init" data-x="350" data-y="103" data-w="500" data-h="66"><rect x="350" y="103" width="500" height="66" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="136.0" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">载入标定参数，累积量置零</text></g><g data-node="sample" data-x="350" data-y="202" data-w="500" data-h="82"><rect x="350" y="202" width="500" height="82" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="227.5" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">每 1 s 读取压力与累计脉冲数</text><text x="600.0" y="258.5" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">ΔP、P₁、N</text></g><g data-node="block" data-x="350" data-y="315" data-w="500" data-h="78"><rect x="350" y="315" width="500" height="78" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="337.5" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">构建 10 s 不重叠数据块</text><text x="600.0" y="370.5" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">块内均值；计数增量换算流量 Q</text></g><g data-node="valid" data-kind="diamond" data-x="410.0" data-y="421.0" data-w="380" data-h="140"><path d="M600 421.0 L790.0 491 L600 561.0 L410.0 491Z" fill="white" stroke="#111" stroke-width="1.65"/><text x="600" y="475.5" font-size="24" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">块数据有效且</text><text x="600" y="506.5" font-size="24" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">健康参照适用？</text></g><g data-node="invalid" data-x="900" data-y="448" data-w="225" data-h="86"><rect x="900" y="448" width="225" height="86" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="1012.5" y="475.5" font-size="23" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">记录不可用状态</text><text x="1012.5" y="506.5" font-size="23" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">本块不参与累积</text></g><g data-node="features" data-x="350" data-y="594" data-w="500" data-h="90"><rect x="350" y="594" width="500" height="90" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="621.5" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">计算块级水力特征</text><text x="600.0" y="656.5" font-size="26" font-family="Cambria, Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">K = Q / √P₁    Rₕ = ΔP / Q²</text></g><g data-node="independent_data" data-x="35" data-y="202" data-w="250" data-h="82"><rect x="35" y="202" width="250" height="82" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="160.0" y="227.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">独立健康数据</text><text x="160.0" y="258.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">按 10 s 分块</text></g><g data-node="calibration" data-x="35" data-y="315" data-w="250" data-h="150"><rect x="35" y="315" width="250" height="150" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="160.0" y="342.0" font-size="24" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">标定健康参照</text><text x="160.0" y="374.0" font-size="24" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">Q<tspan baseline-shift="sub" font-size="72%">ref</tspan>(P₁)、R₀</text><text x="160.0" y="406.0" font-size="24" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">稳健尺度 σ<tspan baseline-shift="sub" font-size="72%">Q</tspan>、σ<tspan baseline-shift="sub" font-size="72%">R</tspan></text><text x="160.0" y="438.0" font-size="24" font-family="Cambria, Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">h = 26（仿真基准）</text></g><g data-node="residual" data-x="350" data-y="720" data-w="500" data-h="110"><rect x="350" y="720" width="500" height="110" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="746.0" font-size="24" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">计算并标准化双通道残差</text><text x="600.0" y="775.0" font-size="24" font-family="Cambria, Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">z<tspan baseline-shift="sub" font-size="72%">Q</tspan> = (Q / Q<tspan baseline-shift="sub" font-size="72%">ref</tspan> − 1) / σ<tspan baseline-shift="sub" font-size="72%">Q</tspan></text><text x="600.0" y="804.0" font-size="24" font-family="Cambria, Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">z<tspan baseline-shift="sub" font-size="72%">R</tspan> = (Rₕ − R₀) / σ<tspan baseline-shift="sub" font-size="72%">R</tspan></text></g><g data-node="cusum" data-x="350" data-y="865" data-w="500" data-h="102"><rect x="350" y="865" width="500" height="102" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="886.0" font-size="24" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">双通道单侧 CUSUM 递推</text><text x="600.0" y="916.0" font-size="24" font-family="Cambria, Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">S<tspan baseline-shift="sub" font-size="72%">j,m</tspan> = max(0, S<tspan baseline-shift="sub" font-size="72%">j,m−1</tspan> + z<tspan baseline-shift="sub" font-size="72%">j,m</tspan> − 0.5)</text><text x="600.0" y="946.0" font-size="24" font-family="Cambria, Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">j ∈ {Q, R}；每个数据块更新一次</text></g><g data-node="threshold" data-kind="diamond" data-x="410.0" data-y="1000.0" data-w="380" data-h="114"><path d="M600 1000.0 L790.0 1057 L600 1114.0 L410.0 1057Z" fill="white" stroke="#111" stroke-width="1.65"/><text x="600" y="1057.0" font-size="27" font-family="Cambria, Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">S<tspan baseline-shift="sub" font-size="72%">Q</tspan> &gt; h 或 S<tspan baseline-shift="sub" font-size="72%">R</tspan> &gt; h？</text></g><g data-node="leak" data-x="35" data-y="1190" data-w="310" data-h="88"><rect x="35" y="1190" width="310" height="88" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="190.0" y="1217.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">等效泄漏候选</text><text x="190.0" y="1250.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">核查附加出流</text></g><g data-node="restriction" data-x="425" data-y="1190" data-w="310" data-h="88"><rect x="425" y="1190" width="310" height="88" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="580.0" y="1217.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">局部受限候选</text><text x="580.0" y="1250.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">核查测点区段阻力</text></g><g data-node="both" data-x="815" data-y="1190" data-w="310" data-h="88"><rect x="815" y="1190" width="310" height="88" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="970.0" y="1217.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">双通道异常候选</text><text x="970.0" y="1250.5" font-size="25" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">结合工况综合核查</text></g><g data-node="event" data-x="300" data-y="1340" data-w="600" data-h="88"><rect x="300" y="1340" width="600" height="88" rx="0" fill="white" stroke="#111" stroke-width="1.65"/><text x="600.0" y="1366.5" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">保存事件、测量质量与参照版本</text><text x="600.0" y="1401.5" font-size="26" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="central">LoRa 上报，人工核查与同工况复测</text></g><text x="634" y="575" font-family="Cambria, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central" stroke="white" stroke-width="7" paint-order="stroke" fill="#111">是</text><text x="839" y="475" font-family="Cambria, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central" stroke="white" stroke-width="7" paint-order="stroke" fill="#111">否</text><text x="955" y="1041" font-family="Cambria, Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" dominant-baseline="central" stroke="white" stroke-width="7" paint-order="stroke" fill="#111">否，继续监测</text><text x="629" y="1133" font-family="Cambria, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central" stroke="white" stroke-width="7" paint-order="stroke" fill="#111">是</text><text x="190" y="1172" font-family="Cambria, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central" stroke="white" stroke-width="7" paint-order="stroke" fill="#111">S<tspan baseline-shift="sub" font-size="72%">Q</tspan> &gt; h，S<tspan baseline-shift="sub" font-size="72%">R</tspan> ≤ h</text><text x="580" y="1172" font-family="Cambria, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central" stroke="white" stroke-width="7" paint-order="stroke" fill="#111">S<tspan baseline-shift="sub" font-size="72%">Q</tspan> ≤ h，S<tspan baseline-shift="sub" font-size="72%">R</tspan> &gt; h</text><text x="970" y="1172" font-family="Cambria, Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central" stroke="white" stroke-width="7" paint-order="stroke" fill="#111">S<tspan baseline-shift="sub" font-size="72%">Q</tspan> &gt; h，S<tspan baseline-shift="sub" font-size="72%">R</tspan> &gt; h</text></g></svg>