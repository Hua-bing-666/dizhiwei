   <text style="font-weight: 700; font-size: 19px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="29.16" y="33.975731" transform="rotate(-0 29.16 33.975731)">图D　项目技术路线（单色学术版）</text>
  </g>
