   <g id="text_1">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #1a1a1a" x="69.47856" y="155.489358" transform="rotate(-0 69.47856 155.489358)">一</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="139.012082" transform="rotate(-0 119.28384 139.012082)">现场与场景　· 在哪、为谁做？</text>
   </g>
   <g id="text_3">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: end; fill: #555555" x="531.95616" y="139.137264" transform="rotate(-0 531.95616 139.137264)">产出：场景边界与故障定义</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="161.351585" transform="rotate(-0 119.28384 161.351585)">监测对象落到支管；阿拉尔 25 万亩自动化灌溉</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #1a1a1a" x="69.47856" y="219.961038" transform="rotate(-0 69.47856 219.961038)">二</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="203.527356" transform="rotate(-0 119.28384 203.527356)">测量与采集　· 测得准不准？</text>
   </g>
   <g id="text_7">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: end; fill: #555555" x="531.95616" y="203.505819" transform="rotate(-0 531.95616 203.505819)">产出：测点与采样契约</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="225.897094" transform="rotate(-0 119.28384 225.897094)">差压 35—40 kPa / ±0.5%FS + 干管参照 + 脉冲流量</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #1a1a1a" x="69.47856" y="284.432718" transform="rotate(-0 69.47856 284.432718)">三</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="267.999036" transform="rotate(-0 119.28384 267.999036)">建模与标定　· 基准怎么定？</text>
   </g>
   <g id="text_11">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: end; fill: #555555" x="531.95616" y="268.094686" transform="rotate(-0 531.95616 268.094686)">产出：健康参照与残差尺度</text>
   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="290.332445" transform="rotate(-0 119.28384 290.332445)">Q=C·P1^n、ΔP=R·Q²；固定 n=0.5，跨 ≥20% 跨度标定</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #1a1a1a" x="69.47856" y="348.904398" transform="rotate(-0 69.47856 348.904398)">四</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="332.470716" transform="rotate(-0 119.28384 332.470716)">判据与验证　· 判得准不准？</text>
   </g>
   <g id="text_15">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: end; fill: #555555" x="531.95616" y="332.49371" transform="rotate(-0 531.95616 332.49371)">产出：误报率与可检边界</text>
   </g>
   <g id="text_16">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="354.678735" transform="rotate(-0 119.28384 354.678735)">10 s 不重叠块 CUSUM，h*=26；泄漏 +2% / 受限 +50%</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #1a1a1a" x="69.47856" y="413.376078" transform="rotate(-0 69.47856 413.376078)">五</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="396.988411" transform="rotate(-0 119.28384 396.988411)">通信与平台　· 怎么传到人？</text>
   </g>
   <g id="text_19">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: end; fill: #555555" x="531.95616" y="396.920859" transform="rotate(-0 531.95616 396.920859)">产出：发收日志与事件链</text>
   </g>
   <g id="text_20">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="419.231274" transform="rotate(-0 119.28384 419.231274)">LoRa ≤10 dBm；帧 55/57/24 B；提交后 ACK；SD 卡可导回</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle; fill: #1a1a1a" x="69.47856" y="478.090096" transform="rotate(-0 69.47856 478.090096)">六</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="461.370482" transform="rotate(-0 119.28384 461.370482)">实验与成果　· 结论怎么可信？</text>
   </g>
   <g id="text_23">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: end; fill: #555555" x="531.95616" y="461.406601" transform="rotate(-0 531.95616 461.406601)">产出：数据集与原型</text>
   </g>
   <g id="text_24">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start; fill: #1a1a1a" x="119.28384" y="483.747485" transform="rotate(-0 119.28384 483.747485)">台架为主 54—72 次注入；保底 / 标准 / 加分三档</text>
   </g>
  </g>
