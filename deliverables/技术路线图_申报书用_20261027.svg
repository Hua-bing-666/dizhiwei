<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2110" viewBox="0 0 1800 2110" data-print-width-mm="150" role="img" aria-labelledby="title desc">
<title id="title">滴灌支管异常识别研究技术路线</title>
<desc id="desc">拟开展的研究方法与验证路线。等效泄漏、区段受限及正常扰动输入水力模型；独立健康工况用于测量标定和健康参照。两类依据共同支持不重叠块特征和CUSUM判据。统一判据支持事件触发采样对照，研究响应时延、漏检及开销，异常候选关联观测记录并形成LoRa可靠上报与人工复测。调参及参数冻结后进行双支路独立验证，独立计量与正常扰动记录为评价依据，单阈值和固定采样作为基线。输出可检边界、适用条件及告警代价。图示研究计划，不表示实测性能已经取得。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#222"/></marker>
<style>
text{font-family:SimSun,"Times New Roman",serif;font-size:41px;fill:#111;text-anchor:middle;dominant-baseline:central}
.method{font-size:44px;font-weight:700}
.box{fill:#fff;stroke:#222;stroke-width:1.7}
.primary{stroke-width:2.3}
.link{fill:none;stroke:#222;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.mainlink{stroke-width:2.2}
</style></defs><rect width="1800" height="2110" fill="#fff"/>
<g id="leak" data-box="leak" data-x="50" data-y="50" data-w="260" data-h="90"><rect class="box" x="50" y="50" width="260" height="90"/>
<text x="180" y="95">等效泄漏</text>
</g>
<g id="restriction" data-box="restriction" data-x="390" data-y="90" data-w="260" data-h="90"><rect class="box" x="390" y="90" width="260" height="90"/>
<text x="520" y="135">区段受限</text>
</g>
<g id="normal" data-box="normal" data-x="50" data-y="270" data-w="300" data-h="100"><rect class="box" x="50" y="270" width="300" height="100"/>
<text x="200" y="320">正常工况扰动</text>
</g>
<g id="physical" data-box="physical" data-x="440" data-y="250" data-w="600" data-h="140"><rect class="box primary" x="440" y="250" width="600" height="140"/>
<text x="740" y="295" class="method">水力建模与归一化特征</text>
<text x="740" y="350">压力—流量关系与区段阻力</text>
</g>
<g id="healthy" data-box="healthy" data-x="1225" data-y="50" data-w="400" data-h="100"><rect class="box" x="1225" y="50" width="400" height="100"/>
<text x="1425" y="100">独立健康工况测量</text>
</g>
<g id="calibration" data-box="calibration" data-x="1150" data-y="270" data-w="550" data-h="140"><rect class="box" x="1150" y="270" width="550" height="140"/>
<text x="1425" y="315">测量标定与误差分析</text>
<text x="1425" y="370">建立健康水力参照</text>
</g>
<path class="link" data-from="leak" data-to="physical" d="M180,140 C180,205 540,175 540,250"/>
<path class="link" data-from="restriction" data-to="physical" d="M520,180 V215 H850 V250"/>
<path class="link" data-from="normal" data-to="physical" d="M350,320 H440"/>
<path class="link" data-from="healthy" data-to="calibration" d="M1425,150 V270"/>
<g id="features" data-box="features" data-x="500" data-y="500" data-w="670" data-h="110"><rect class="box primary" x="500" y="500" width="670" height="110"/>
<text x="835" y="555" class="method">参照残差与不重叠块特征</text>
</g>
<path class="link mainlink" data-from="physical" data-to="features" d="M740,390 C740,450 680,440 680,500"/>
<path class="link" data-from="calibration" data-to="features" d="M1425,410 C1425,470 990,440 990,500"/>
<g id="diagnosis" data-box="diagnosis" data-x="340" data-y="720" data-w="690" data-h="110"><rect class="box primary" x="340" y="720" width="690" height="110"/>
<text x="685" y="775" class="method">块级CUSUM与切换复判</text>
</g>
<path class="link mainlink" data-from="features" data-to="diagnosis" d="M835,610 C835,670 685,650 685,720"/>
<g id="sampling" data-box="sampling" data-x="1180" data-y="650" data-w="550" data-h="110"><rect class="box primary" x="1180" y="650" width="550" height="110"/>
<text x="1455" y="705" class="method">固定与事件触发采样对照</text>
</g>
<path class="link" data-from="diagnosis" data-to="sampling" d="M1030,775 C1110,775 1100,705 1180,705"/>
<text x="1120" y="825">同一判据</text>
<g id="sampling-analysis" data-box="sampling-analysis" data-x="1270" data-y="870" data-w="460" data-h="100"><rect class="box" x="1270" y="870" width="460" height="100"/>
<text x="1500" y="920">时延、漏检与开销</text>
</g>
<path class="link" data-from="sampling" data-to="sampling-analysis" d="M1455,760 C1455,820 1500,810 1500,870"/>
<g id="event-evidence" data-box="event-evidence" data-x="180" data-y="950" data-w="590" data-h="110"><rect class="box" x="180" y="950" width="590" height="110"/>
<text x="475" y="1005">异常候选及观测关联</text>
</g>
<path class="link mainlink" data-from="diagnosis" data-to="event-evidence" d="M685,830 C685,900 475,890 475,950"/>
<g id="warning" data-box="warning" data-x="800" data-y="1110" data-w="830" data-h="140"><rect class="box" x="800" y="1110" width="830" height="140"/>
<text x="1215" y="1155">LoRa可靠上报与落库确认</text>
<text x="1215" y="1210">人工核查及同工况复测</text>
</g>
<path class="link mainlink" data-from="event-evidence" data-to="warning" d="M770,1005 C890,1005 1030,1020 1030,1110"/>
<path class="link" data-from="sampling-analysis" data-to="warning" d="M1500,970 C1500,1035 1460,1035 1460,1110"/>
<g id="freeze" data-box="freeze" data-x="490" data-y="1340" data-w="700" data-h="110"><rect class="box" x="490" y="1340" width="700" height="110"/>
<text x="840" y="1395">调参试验与参数冻结</text>
</g>
<path class="link mainlink" data-from="warning" data-to="freeze" d="M1100,1250 C1100,1300 840,1280 840,1340"/>
<g id="validation" data-box="validation" data-x="500" data-y="1530" data-w="680" data-h="110"><rect class="box" x="500" y="1530" width="680" height="110"/>
<text x="840" y="1585">双支路台架独立验证</text>
</g>
<path class="link mainlink" data-from="freeze" data-to="validation" d="M840,1450 V1530"/>
<g id="records" data-box="records" data-x="70" data-y="1515" data-w="340" data-h="140"><rect class="box" x="70" y="1515" width="340" height="140"/>
<text x="240" y="1560">独立计量</text>
<text x="240" y="1615">与操作记录</text>
</g>
<path class="link" data-from="records" data-to="validation" d="M410,1585 H500"/>
<g id="controls" data-box="controls" data-x="1330" data-y="1400" data-w="400" data-h="140"><rect class="box" x="1330" y="1400" width="400" height="140"/>
<text x="1530" y="1445">故障与正常扰动</text>
<text x="1530" y="1500">供压及B支路切换</text>
</g>
<path class="link" data-from="controls" data-to="validation" d="M1330,1470 C1240,1470 1280,1585 1180,1585"/>
<g id="comparison" data-box="comparison" data-x="700" data-y="1740" data-w="790" data-h="110"><rect class="box" x="700" y="1740" width="790" height="110"/>
<text x="1095" y="1795">基线与采样策略对照评价</text>
</g>
<path class="link mainlink" data-from="validation" data-to="comparison" d="M840,1640 C840,1690 1095,1680 1095,1740"/>
<g id="baselines" data-box="baselines" data-x="90" data-y="1725" data-w="430" data-h="140"><rect class="box" x="90" y="1725" width="430" height="140"/>
<text x="305" y="1770">单阈值基线</text>
<text x="305" y="1825">固定采样基线</text>
</g>
<path class="link" data-from="baselines" data-to="comparison" d="M520,1795 H700"/>
<g id="boundaries" data-box="boundaries" data-x="750" data-y="1930" data-w="970" data-h="140"><rect class="box primary" x="750" y="1930" width="970" height="140"/>
<text x="1235" y="1975" class="method">可检边界与适用条件</text>
<text x="1235" y="2030">检出、误报、时延、送达与开销</text>
</g>
<path class="link mainlink" data-from="comparison" data-to="boundaries" d="M1095,1850 C1095,1895 1235,1885 1235,1930"/>
</svg>