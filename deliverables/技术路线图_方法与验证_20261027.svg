</g>
<g id="truth-records" data-box="truth-records" data-x="1340" data-y="1790" data-w="420" data-h="110"><rect class="box" x="1340" y="1790" width="420" height="110"/>
<text x="1550" y="1845">独立计量与操作记录</text>
</g>
