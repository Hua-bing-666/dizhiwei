<text x="900" y="90">南疆棉田支管异常识别与可靠预警</text>
</g>
<g id="fault-input" data-box="fault-input" data-x="60" data-y="220" data-w="440" data-h="100"><rect class="box" x="60" y="220" width="440" height="100"/>
<text x="280" y="270">等效泄漏与区段受限</text>
</g>
<g id="normal-input" data-box="normal-input" data-x="680" data-y="220" data-w="440" data-h="100"><rect class="box" x="680" y="220" width="440" height="100"/>
<text x="900" y="270">供压变化与支路切换</text>
</g>
<g id="healthy-input" data-box="healthy-input" data-x="1300" data-y="220" data-w="440" data-h="100"><rect class="box" x="1300" y="220" width="440" height="100"/>
<text x="1520" y="270">独立健康工况采集</text>
</g>
<path class="link" data-from="goal" data-to="fault-input" d="M900,140 V180 H280 V220"/>
<path class="link" data-from="goal" data-to="normal-input" d="M900,140 V220"/>
<path class="link" data-from="goal" data-to="healthy-input" d="M900,140 V180 H1520 V220"/>
<g id="physical-model" data-box="physical-model" data-x="340" data-y="400" data-w="500" data-h="140"><rect class="box" x="340" y="400" width="500" height="140"/>
<text x="590" y="445">故障与扰动水力建模</text>
<text x="590" y="500">提取水力响应特征</text>
</g>
<g id="healthy-reference" data-box="healthy-reference" data-x="1300" data-y="400" data-w="440" data-h="140"><rect class="box" x="1300" y="400" width="440" height="140"/>
<text x="1520" y="445">测量标定与误差分析</text>
<text x="1520" y="500">健康数据建立参照</text>
</g>
<path class="link" data-from="fault-input" data-to="physical-model" d="M280,320 V360 H490 V400"/>
<path class="link" data-from="normal-input" data-to="physical-model" d="M900,320 V360 H690 V400"/>
