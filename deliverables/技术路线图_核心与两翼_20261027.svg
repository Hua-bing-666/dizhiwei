<path class="link main" data-from="cusum" data-to="fair-calibration" d="M900,1070 V1190"/>
<g id="freeze" data-box="freeze" data-x="650" data-y="1560" data-w="500" data-h="140"><rect class="box feature" x="650" y="1560" width="500" height="140"/>
