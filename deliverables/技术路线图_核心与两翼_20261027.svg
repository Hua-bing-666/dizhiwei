<g id="outcome" data-box="outcome" data-x="1320" data-y="1980" data-w="450" data-h="140"><rect class="box result" x="1320" y="1980" width="450" height="140"/>
<text x="1545" y="2025" class="heading">可检边界与适用条件</text>
<text x="1545" y="2080" class="heading">幅度—持续时间</text>
</g>
<path class="link main" data-from="comparison" data-to="outcome" d="M1200,2050 H1320"/>
</svg>