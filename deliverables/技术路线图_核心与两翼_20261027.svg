</g>
<path class="link" data-from="alignment" data-to="calibration" d="M1490,390 V460"/>
<g id="reference" data-box="reference" data-x="1210" data-y="670" data-w="560" data-h="90"><rect class="box" x="1210" y="670" width="560" height="90"/>
<text x="1490" y="715">独立健康参照与残差尺度</text>
</g>
<path class="link" data-from="calibration" data-to="reference" d="M1490,570 V670"/>
<g id="blocks" data-box="blocks" data-x="680" data-y="645" data-w="440" data-h="140"><rect class="box feature" x="680" y="645" width="440" height="140"/>
<text x="900" y="690" class="heading">归一化参照残差</text>
<text x="900" y="745">不重叠块特征</text>
</g>
<path class="link main" data-from="sensitivity" data-to="blocks" d="M590,715 H680"/>
<path class="link" data-from="reference" data-to="blocks" d="M1210,715 H1120"/>
<g id="cusum" data-box="cusum" data-x="680" data-y="920" data-w="440" data-h="150"><rect class="box core" x="680" y="920" width="440" height="150"/>
<text x="900" y="965" class="core-title">块级CUSUM判据</text>
<text x="900" y="1020">切换工况挂起与复判</text>
</g>
<path class="link main" data-from="blocks" data-to="cusum" d="M900,785 V920"/>
<g id="candidate" data-box="candidate" data-x="30" data-y="925" data-w="560" data-h="140"><rect class="box" x="30" y="925" width="560" height="140"/>
<text x="310" y="970" class="heading">持续异常候选</text>
<text x="310" y="1025">观测记录与事件关联</text>
</g>
<g id="sampling" data-box="sampling" data-x="1210" data-y="925" data-w="560" data-h="140"><rect class="box focus" x="1210" y="925" width="560" height="140"/>
<text x="1490" y="970" class="heading">事件触发采样研究</text>
<text x="1490" y="1025">固定采样对照与统一判据</text>
</g>
<path class="link" data-from="cusum" data-to="candidate" d="M680,995 H590"/>
<path class="link main" data-from="cusum" data-to="sampling" d="M1120,995 H1210"/>
<g id="delivery" data-box="delivery" data-x="30" data-y="1140" data-w="560" data-h="140"><rect class="box" x="30" y="1140" width="560" height="140"/>
<text x="310" y="1185" class="heading">LoRa可靠传输</text>
<text x="310" y="1240">重发、去重与提交后确认</text>
</g>
<path class="link" data-from="candidate" data-to="delivery" d="M310,1065 V1140"/>
<g id="recheck" data-box="recheck" data-x="30" data-y="1370" data-w="560" data-h="140"><rect class="box" x="30" y="1370" width="560" height="140"/>
<text x="310" y="1415" class="heading">可核查告警链</text>
<text x="310" y="1470">人工核查与同工况复测</text>
</g>
<path class="link" data-from="delivery" data-to="recheck" d="M310,1280 V1370"/>
<g id="fixed" data-box="fixed" data-x="1210" data-y="1165" data-w="260" data-h="90"><rect class="box input" x="1210" y="1165" width="260" height="90" rx="12"/>
<text x="1340" y="1210">固定采样</text>
</g>
<g id="triggered" data-box="triggered" data-x="1510" data-y="1165" data-w="260" data-h="90"><rect class="box input" x="1510" y="1165" width="260" height="90" rx="12"/>
<text x="1640" y="1210">事件触发</text>
</g>
