<text x="900" y="1835">留出批次独立验证</text>
</g>
<path class="link main" data-from="freeze" data-to="validation" d="M900,1700 V1780"/>
<g id="bench" data-box="bench" data-x="30" data-y="1765" data-w="450" data-h="140"><rect class="box" x="30" y="1765" width="450" height="140"/>
<text x="255" y="1810" class="heading">双支路对照试验</text>
<text x="255" y="1865">A支路注入/B支路切换</text>
</g>
<g id="records" data-box="records" data-x="1320" data-y="1765" data-w="450" data-h="140"><rect class="box" x="1320" y="1765" width="450" height="140"/>
<text x="1545" y="1810" class="heading">独立计量</text>
<text x="1545" y="1865">与操作记录</text>
</g>
<path class="link" data-from="bench" data-to="validation" d="M480,1835 H600"/>
<path class="link" data-from="records" data-to="validation" d="M1320,1835 H1200"/>
<g id="comparison" data-box="comparison" data-x="600" data-y="1980" data-w="600" data-h="140"><rect class="box" x="600" y="1980" width="600" height="140"/>
<text x="900" y="2025" class="heading">基线与策略对照评价</text>
<text x="900" y="2080">检出、误报、时延、送达与开销</text>
</g>
