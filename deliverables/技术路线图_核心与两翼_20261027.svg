<g id="baselines" data-box="baselines" data-x="30" data-y="1980" data-w="450" data-h="140"><rect class="box" x="30" y="1980" width="450" height="140"/>
<text x="255" y="2025" class="heading">单阈值基线</text>
<text x="255" y="2080">固定采样基线</text>
</g>
