<path class="link" data-from="sampling" data-to="triggered" d="M1490,1065 V1115 H1640 V1165"/>
<g id="sampling-config" data-box="sampling-config" data-x="1210" data-y="1370" data-w="560" data-h="140"><rect class="box" x="1210" y="1370" width="560" height="140"/>
