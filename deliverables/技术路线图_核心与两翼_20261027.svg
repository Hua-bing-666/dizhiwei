<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2160" viewBox="0 0 1800 2160" data-print-width-mm="155" role="img" aria-labelledby="title desc">
<title id="title">南疆滴灌支管异常识别与采集策略研究技术路线</title>
<desc id="desc">拟开展的研究技术路线。两侧水力机理和同步测量研究为中间的归一化残差及不重叠块特征提供依据。块级CUSUM位于主轴，向左形成候选事件、可靠LoRa传输和人工核查研究，向右开展固定采样及事件触发采样的同判据比较。主轴同时开展同误报水平的判据及基线参数标定。两翼研究与判据参数在冻结阶段汇合，继而进行双支路留出批次验证和基线比较，评价可检幅度、持续时间及适用条件。仅健康标定数据用于健康参照；故障操作真值用于独立评价。图示研究计划，不表示实物性能已取得。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#252525"/></marker>
<style>
text{font-family:SimSun,"Times New Roman",serif;font-size:40px;fill:#111;text-anchor:middle;dominant-baseline:central}
.heading{font-size:42px;font-weight:700}.core-title{font-size:44px;font-weight:700}
.box{fill:#fff;stroke:#3c3c3c;stroke-width:1.6}.input{stroke:#555;stroke-width:1.4}
.feature{fill:#fafafa;stroke:#303030;stroke-width:2}.core{fill:#e8e8e8;stroke:#202020;stroke-width:2.8}
.focus{fill:#f3f3f3;stroke:#303030;stroke-width:2.2}.result{fill:#f7f7f7;stroke:#353535;stroke-width:1.9}
.link{fill:none;stroke:#303030;stroke-width:1.6;stroke-linejoin:round;marker-end:url(#arrow)}.main{stroke-width:2.2}
.rule{stroke:#aaa;stroke-width:1.1}
</style></defs><rect width="1800" height="2160" fill="#fff"/>
<text x="310" y="50" class="heading">故障与正常扰动建模</text>
<text x="1490" y="50" class="heading">同步测量与健康标定</text>
<path class="rule" d="M30,85 H590 M1210,85 H1770"/>
<g id="faults" data-box="faults" data-x="30" data-y="120" data-w="300" data-h="90"><rect class="box input" x="30" y="120" width="300" height="90" rx="12"/>
<text x="180" y="165">等效泄漏/受限</text>
</g>
<g id="disturbance" data-box="disturbance" data-x="370" data-y="120" data-w="220" data-h="90"><rect class="box input" x="370" y="120" width="220" height="90" rx="12"/>
<text x="480" y="165">供压/切换</text>
</g>
<g id="model" data-box="model" data-x="30" data-y="290" data-w="560" data-h="100"><rect class="box" x="30" y="290" width="560" height="100"/>
<text x="310" y="340">故障与扰动水力建模</text>
</g>
<path class="link" data-from="faults" data-to="model" d="M180,210 V250 H210 V290"/>
<path class="link" data-from="disturbance" data-to="model" d="M480,210 V250 H410 V290"/>
<g id="pressure-flow" data-box="pressure-flow" data-x="30" data-y="460" data-w="260" data-h="140"><rect class="box" x="30" y="460" width="260" height="140"/>
<text x="160" y="505" class="heading">压力—流量</text>
<text x="160" y="560">耦合特征</text>
</g>
<g id="resistance" data-box="resistance" data-x="330" data-y="460" data-w="260" data-h="140"><rect class="box" x="330" y="460" width="260" height="140"/>
<text x="460" y="505" class="heading">区段阻力</text>
<text x="460" y="560">变化特征</text>
</g>
<path class="link" data-from="model" data-to="pressure-flow" d="M310,390 V425 H160 V460"/>
<path class="link" data-from="model" data-to="resistance" d="M310,390 V425 H460 V460"/>
<g id="sensitivity" data-box="sensitivity" data-x="30" data-y="670" data-w="560" data-h="90"><rect class="box" x="30" y="670" width="560" height="90"/>
<text x="310" y="715">特征敏感性与扰动分析</text>
</g>
<path class="link" data-from="pressure-flow" data-to="sensitivity" d="M160,600 V635 H210 V670"/>
<path class="link" data-from="resistance" data-to="sensitivity" d="M460,600 V635 H410 V670"/>
<g id="pressure" data-box="pressure" data-x="1210" data-y="120" data-w="260" data-h="90"><rect class="box input" x="1210" y="120" width="260" height="90" rx="12"/>
<text x="1340" y="165">压力/压差</text>
</g>
<g id="flow" data-box="flow" data-x="1510" data-y="120" data-w="260" data-h="90"><rect class="box input" x="1510" y="120" width="260" height="90" rx="12"/>
<text x="1640" y="165">流量脉冲</text>
</g>
<g id="alignment" data-box="alignment" data-x="1210" data-y="290" data-w="560" data-h="100"><rect class="box" x="1210" y="290" width="560" height="100"/>
<text x="1490" y="340">时序对齐与连续计数</text>
</g>
<path class="link" data-from="pressure" data-to="alignment" d="M1340,210 V250 H1390 V290"/>
<path class="link" data-from="flow" data-to="alignment" d="M1640,210 V250 H1590 V290"/>
<g id="calibration" data-box="calibration" data-x="1210" data-y="460" data-w="560" data-h="110"><rect class="box" x="1210" y="460" width="560" height="110"/>
