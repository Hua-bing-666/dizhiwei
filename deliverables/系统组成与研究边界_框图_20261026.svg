<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="995" viewBox="0 0 1800 995" role="img" aria-labelledby="title desc">
  <title id="title">系统组成与研究边界</title>
  <desc id="desc">拟研制的单节点原型系统。双支路清水台架向感知诊断节点提供观测，节点经LoRa与接收端通信，接收端通过串口连接本地巡检平台。接收确认在平台存储成功后回传。节点另设模拟控制和预留接口，开展固定1Hz基线与分级采集对照。平台的人工核查、同工况复测回到台架。多节点和田间适用性列为后续扩展。本图为方案示意，不代表硬件已经完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 Z" fill="#111"/></marker>
    <style>
      text { font-family: SimSun, "Times New Roman", serif; font-size: 42px; fill: #111; text-anchor: middle; dominant-baseline: central; }
      .heading { font-size: 42px; font-weight: 700; }
      .latin { font-family: "Times New Roman", SimSun, serif; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.6; }
      .link { fill: none; stroke: #111; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 12 9; }
    </style>
  </defs>
  <rect width="1800" height="995" fill="#fff"/>
  <rect x="20" y="25" width="1760" height="755" fill="none" stroke="#111" stroke-width="1.8"/>
  <text class="heading" x="55" y="77" style="text-anchor:start">本期研究范围</text>
  <text x="1745" y="77" style="text-anchor:end">单节点原型 · A/B 双支路台架</text>

  <g id="bench" data-box="bench" data-x="40" data-y="145" data-w="340" data-h="270">
    <rect class="box" x="40" y="145" width="340" height="270"/>
    <text class="heading" x="210" y="195">双支路清水台架</text>
    <text x="210" y="252">A支路故障注入</text>
    <text x="210" y="309">B支路负载切换</text>
    <text x="210" y="366">独立参考测量</text>
  </g>
  <g id="node" data-box="node" data-x="500" data-y="145" data-w="340" data-h="270">
    <rect class="box" x="500" y="145" width="340" height="270"/>
    <text class="heading" x="670" y="195">感知诊断节点</text>
    <text x="670" y="252">压力/流量采集</text>
    <text x="670" y="309">本地诊断与记录</text>
    <text x="670" y="366">异常事件生成</text>
  </g>
  <g id="receiver" data-box="receiver" data-x="960" data-y="145" data-w="340" data-h="270">
    <rect class="box" x="960" y="145" width="340" height="270"/>
    <text class="heading" x="1130" y="195">LoRa接收端</text>
    <text x="1130" y="252">无线数据转接</text>
    <text x="1130" y="309">串口连接电脑</text>
    <text x="1130" y="366">接收确认回传</text>
  </g>
  <g id="platform" data-box="platform" data-x="1420" data-y="145" data-w="340" data-h="270">
    <rect class="box" x="1420" y="145" width="340" height="270"/>
    <text class="heading" x="1590" y="195">本地巡检平台</text>
    <text x="1590" y="252">数据校验与存储</text>
    <text x="1590" y="309">状态与趋势展示</text>
    <text x="1590" y="366">核查与复测记录</text>
  </g>

  <path class="link" data-from="bench" data-to="node" d="M380,280 H500"/>
  <text data-link-label="observation" x="440" y="247">观测</text>
  <path class="link" data-from="node" data-to="receiver" d="M840,235 H960"/>
  <text class="latin" data-link-label="lora" x="900" y="201">LoRa</text>
  <path class="link" data-from="receiver" data-to="node" d="M960,340 H840"/>
  <text class="latin" data-link-label="radio-ack" x="900" y="306">ACK</text>
  <path class="link" data-from="receiver" data-to="platform" d="M1300,235 H1420"/>
  <text class="latin" data-link-label="uart" x="1360" y="201">UART</text>
  <path class="link" data-from="platform" data-to="receiver" d="M1420,340 H1300"/>
  <text class="latin" data-link-label="host-ack" x="1360" y="306">ACK</text>

  <g id="control" data-box="control" data-x="390" data-y="495" data-w="560" data-h="150">
    <rect class="box dashed" x="390" y="495" width="560" height="150"/>
    <text class="heading" x="670" y="542">模拟控制与接口预留</text>
    <text x="670" y="600">软件请求、LED/蜂鸣器</text>
  </g>
  <path class="link dashed" data-from="node" data-to="control" d="M670,415 V495"/>
  <g id="sampling" data-box="sampling" data-x="1000" data-y="495" data-w="590" data-h="150">
    <rect class="box" x="1000" y="495" width="590" height="150"/>
    <text class="heading" x="1295" y="542">采集策略对照研究</text>
    <text x="1295" y="600">固定1 Hz基线 / 分级采集</text>
  </g>
  <path class="link" data-from="node" data-to="sampling" d="M840,375 H900 V458 H1295 V495"/>

  <path class="link dashed" data-from="platform" data-to="bench" d="M1680,415 V735 H210 V415"/>
  <text data-link-label="manual-retest" x="1270" y="697">人工核查、同工况复测</text>

  <text x="55" y="825" style="text-anchor:start">实线：数据与业务联系　　虚线：人工复核或预留接口</text>
  <g id="extension" data-box="extension" data-x="20" data-y="880" data-w="1760" data-h="90">
    <rect class="box dashed" x="20" y="880" width="1760" height="90"/>
    <text class="heading" x="55" y="925" style="text-anchor:start">后续扩展</text>
    <text x="500" y="925" style="text-anchor:start">多节点分区监测 · 田间适用性验证</text>
  </g>
</svg>
