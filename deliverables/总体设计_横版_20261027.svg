<path class="link " data-from="branch-a" data-to="flow" d="M180,280 V325 H60 V895 H80"/>
<path class="link " data-from="pressure" data-to="adc" d="M380,550 H430"/>
<path class="link " data-from="adc" data-to="mcu" d="M590,620 V760"/>
<text x="665" y="690" class="interface">I²C</text>
<path class="link " data-from="flow" data-to="mcu" d="M380,890 H430"/>
<path class="link " data-from="mcu" data-to="node-radio" d="M750,820 H770 V550 H790"/>
<text x="865" y="702" class="interface">UART</text>
<path d="M762,814 L750,820 L762,826 Z" fill="#435a69"/>
<path class="link " data-from="mcu" data-to="sd" d="M750,910 H790"/>
<text x="865" y="1006" class="interface">SPI</text>
<path class="link radio" data-from="node-radio" data-to="receiver-radio" d="M1090,525 H1200"/>
<text x="1140" y="465" class="interface">LoRa</text>
<path class="link ack" data-from="receiver-radio" data-to="node-radio" d="M1200,575 H1090"/>
<text x="1140" y="653" class="interface">ACK</text>
<path class="link " data-from="receiver-radio" data-to="usb" d="M1500,520 H1540"/>
