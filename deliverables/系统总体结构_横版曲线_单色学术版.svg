<text x="40" y="820" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#555555">注：实线为数据 / 业务流；虚线为共同扰动、参照测点、人工流程、预留接口或反馈。P₀ / P₁ 为监测区段上下游压力，Q 为分流前总流量。</text>
<text x="40" y="848" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#555555">A 支路为被测支管，B 支路模拟邻支路轮灌扰动；台架侧操作标签与参考计量独立于诊断结果记录，用于独立实验评价。</text>
