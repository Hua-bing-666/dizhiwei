<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="white"/><text x="28" y="52" font-size="38" font-weight="700" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">硬件量程与不确定度核对（24 组未标定设计计算）</text><text x="28" y="88" font-size="21" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">口径唯一真源 v2.2：0—40 kPa 档 / ±0.5%FS（K040）· 设计工况 U ≤ 0.20 kPa（较 +2% 边界余量 10×）</text><rect x="20" y="116" width="1400" height="44" fill="#eef5f2"/><text x="40" y="146" font-size="21" font-weight="700" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">传感器 / 通道</text><text x="452" y="146" font-size="21" font-weight="700" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">量程</text><text x="636" y="146" font-size="21" font-weight="700" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">设计工况跨度</text><text x="900" y="146" font-size="21" font-weight="700" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">不确定度 U</text><text x="1174" y="146" font-size="21" font-weight="700" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">是否满足</text><rect x="20" y="164" width="1400" height="56" fill="#ffffff" stroke="#9fb3ab" stroke-width="1"/><text x="40" y="198" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">差压 ΔP = P1−P0</text><text x="452" y="198" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">0—40 kPa</text><text x="636" y="198" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">≈ 2—8 kPa</text><text x="900" y="198" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">≤ 0.20 kPa</text><text x="1174" y="198" font-size="19" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">满足（±0.5%FS）</text><rect x="20" y="220" width="1400" height="56" fill="#ffffff" stroke="#9fb3ab" stroke-width="1"/><text x="40" y="254" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">P1 取压嘴B</text><text x="452" y="254" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">0—40 kPa</text><text x="636" y="254" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">≈ 20—35 kPa</text><text x="900" y="254" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">≤ 0.20 kPa</text><text x="1174" y="254" font-size="19" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">满足</text><rect x="20" y="276" width="1400" height="56" fill="#ffffff" stroke="#9fb3ab" stroke-width="1"/><text x="40" y="310" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">P0 取压嘴A（干管参照）</text><text x="452" y="310" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">0—40 kPa</text><text x="636" y="310" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">≈ 20—35 kPa</text><text x="900" y="310" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">≤ 0.20 kPa</text><text x="1174" y="310" font-size="19" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">满足</text><rect x="20" y="332" width="1400" height="56" fill="#ffffff" stroke="#9fb3ab" stroke-width="1"/><text x="40" y="366" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">Q 流量计</text><text x="452" y="366" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">0.3—5 L/min</text><text x="636" y="366" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">≈ 0.5—3 L/min</text><text x="900" y="366" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">±1% ≈ 0.03 L/min</text><text x="1174" y="366" font-size="19" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">满足（540 脉冲/L）</text><rect x="20" y="388" width="1400" height="56" fill="#ffffff" stroke="#9fb3ab" stroke-width="1"/><text x="40" y="422" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">K = Q/√P1 通道</text><text x="452" y="422" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">派生量</text><text x="636" y="422" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">跨度 ≥20% 拟合 n</text><text x="900" y="422" font-size="19" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">增益漂移 ≤0.10%</text><text x="1174" y="422" font-size="19" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">满足（n 默认 0.5）</text><text x="28" y="480" font-size="28" font-weight="700" fill="#142a30" font-family="Microsoft YaHei,SimSun,sans-serif">台架范围核对结论（24 组：多供压 × 多流量组合）</text><text x="28" y="524" font-size="20" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">• 等效泄漏：+2% 边界需 80 s 注入窗（40/40 检出）；+5% 需 20 s；+10% 需 10 s。</text><text x="28" y="560" font-size="20" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">• 等效受限：+50% 才 40/40（80 s）；+30% 仅 32/40 ⇒ 申报口径取 +50%（80 s）或 +30% 需 ≥5 min。</text><text x="28" y="596" font-size="20" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">• 时间常数 τ：≤5 s 无影响；τ=120 s 门限需 14.5× ⇒ 台架必测 τ，τ≤10 s 才可直接用 10 s 块判据。</text><text x="28" y="632" font-size="20" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">• 慢漂移：K 通道容限 ≈1%/h（自适应基线可翻倍）；为全项目最紧约束，须台架静置 ≥8 h 实测。</text><text x="28" y="668" font-size="20" fill="#52636a" font-family="Microsoft YaHei,SimSun,sans-serif">• 原理性边界：下游负载自身变化与等效泄漏在 (P0,P1,Q) 下严格不可区分 ⇒ 仅输出“异常·建议核查”。</text></svg>
