<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#142a30"/></marker></defs><rect width="1000" height="930" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif"><text x="28.0" y="42.0" font-size="28" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="start" fill="#142a30">清水台架：测量、注入与独立计量</text><text x="28.0" y="78.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#52636a">候选结构；尚未制造 · 水路口径 Q 最上游（与图3-9、网络拓扑一致）</text><path d="M 70.0 350.0 L 900.0 350.0" fill="none" stroke="#52636a" stroke-width="7"/><rect x="85.0" y="300.0" width="130.0" height="100.0" rx="4" fill="#eaf1f7" stroke="#142a30" stroke-width="2"/><text x="150.0" y="343.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">① Q</text><text x="150.0" y="373.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">流量计</text><rect x="250.0" y="300.0" width="130.0" height="100.0" rx="4" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="315.0" y="343.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">② P0</text><text x="315.0" y="373.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">取压嘴A</text><rect x="415.0" y="300.0" width="130.0" height="100.0" rx="4" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="480.0" y="343.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">③ R</text><text x="480.0" y="373.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">等效受限</text><rect x="580.0" y="300.0" width="130.0" height="100.0" rx="4" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="645.0" y="343.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">④ P1</text><text x="645.0" y="373.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">取压嘴B</text><path d="M 740.0 350.0 L 740.0 540.0" fill="none" stroke="#52636a" stroke-width="7"/><path d="M 890.0 350.0 L 890.0 540.0" fill="none" stroke="#52636a" stroke-width="7"/><rect x="670.0" y="540.0" width="140.0" height="100.0" rx="4" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="740.0" y="583.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">⑤ A</text><text x="740.0" y="613.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">正常负载</text><rect x="820.0" y="540.0" width="140.0" height="100.0" rx="4" fill="#ffffff" stroke="#b8543f" stroke-width="2"/><text x="890.0" y="583.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">⑦ 泄漏</text><text x="890.0" y="613.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">独立收集</text><path d="M 645.0 300.0 L 645.0 190.0" fill="none" stroke="#52636a" stroke-width="7"/><path d="M 645.0 190.0 L 545.0 190.0" fill="none" stroke="#52636a" stroke-width="7"/><rect x="370.0" y="150.0" width="175.0" height="80.0" rx="4" fill="#eaf1f7" stroke="#142a30" stroke-width="2"/><text x="457.5" y="183.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">⑥ B</text><text x="457.5" y="213.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">健康负载切换</text><rect x="690.0" y="100.0" width="175.0" height="76.0" rx="4" fill="#eaf1f7" stroke="#142a30" stroke-width="2"/><text x="777.5" y="131.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">注入/标定</text><text x="777.5" y="161.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">工况源</text><path d="M 865.0 176.0 L 872.0 215.0" fill="none" stroke="#142a30" stroke-width="2" stroke-dasharray="7 5"/><path d="M 900.0 350.0 L 900.0 330.0" fill="none" stroke="#52636a" stroke-width="7"/><rect x="865.0" y="215.0" width="120.0" height="115.0" rx="4" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="925.0" y="248.6" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">⑧</text><text x="925.0" y="280.6" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">采集</text><text x="925.0" y="312.6" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">LoRa</text><path d="M 150.0 400.0 L 150.0 452.0" fill="none" stroke="#142a30" stroke-width="1.4" stroke-dasharray="7 5"/><text x="150.0" y="430.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">Q</text><path d="M 315.0 400.0 L 315.0 452.0" fill="none" stroke="#142a30" stroke-width="1.4" stroke-dasharray="7 5"/><text x="315.0" y="430.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">P0</text><path d="M 645.0 400.0 L 645.0 452.0" fill="none" stroke="#142a30" stroke-width="1.4" stroke-dasharray="7 5"/><text x="645.0" y="430.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">P1</text><path d="M 150.0 452.0 L 860.0 452.0" fill="none" stroke="#142a30" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 860.0 452.0 L 860.0 330.0" fill="none" stroke="#142a30" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 860.0 330.0 L 865.0 330.0" fill="none" stroke="#142a30" stroke-width="1.4" stroke-dasharray="7 5"/><text x="28.0" y="730.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="start" fill="#142a30">A 支路：Q(流量计) → P0 → R → P1 → 正常负载与泄漏分流。</text><text x="28.0" y="772.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#52636a">Q 包含正常与泄漏流量；B 只提供正常负载变化对照（并联，不参与故障注入）。</text><text x="28.0" y="814.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#52636a">⑧ 节点采集 Q / P0 / P1 三路，经 LoRa 上报；⑦ 泄漏支路设独立收集杯，用于比对注入量。</text><text x="28.0" y="856.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#52636a">编号：1=Q  2=P0  3=R  4=P1  5=A  6=B  7=泄漏收集  8=采集/LoRa。</text></g></svg>
