<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#142a30"/></marker></defs><rect width="1000" height="620" fill="white"/><g font-family="Microsoft YaHei,SimSun,sans-serif"><text x="28.0" y="44.0" font-size="30" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="start" fill="#142a30">系统组成与独立评价</text><text x="28.0" y="78.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">感知诊断节点 — LoRa — 本地维护软件；试验评价独立于主链路，用独立标签核对</text><rect x="40.0" y="130.0" width="300.0" height="300.0" rx="5" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="190.0" y="183.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">感知诊断节点</text><text x="190.0" y="225.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">GD32F103CBT6 主控</text><text x="190.0" y="267.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">MDM490 差压 0—40 kPa</text><text x="190.0" y="309.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">干管参照 0—200 kPa</text><text x="190.0" y="351.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">SEN0549 脉冲流量</text><text x="190.0" y="393.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">E220-400T22D</text><rect x="420.0" y="170.0" width="230.0" height="220.0" rx="5" fill="#eaf1f7" stroke="#142a30" stroke-width="2"/><text x="535.0" y="216.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">接收端 / 本地 Web</text><text x="535.0" y="252.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">告警与历史</text><text x="535.0" y="288.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">人工核查记录</text><text x="535.0" y="324.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">处置与复测</text><text x="535.0" y="360.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">证据归档</text><rect x="730.0" y="170.0" width="230.0" height="220.0" rx="5" fill="#ffffff" stroke="#b8543f" stroke-width="2" stroke-dasharray="8 5"/><text x="845.0" y="216.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">独立试验评价</text><text x="845.0" y="252.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">台架真值与注入量</text><text x="845.0" y="288.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">独立标签</text><text x="845.0" y="324.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">离线回放</text><text x="845.0" y="360.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">不参与在线告警</text><path d="M 340.0 280.0 L 418.0 280.0" fill="none" stroke="#142a30" stroke-width="2.2" marker-end="url(#ar)"/><text x="379.0" y="262.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#b8543f">LoRa</text><text x="379.0" y="312.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">433 MHz</text><path d="M 650.0 280.0 L 728.0 280.0" fill="none" stroke="#142a30" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ar)"/><text x="689.0" y="262.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#b8543f">独立核对</text><text x="28.0" y="494.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">说明：在线链路只做 感知 → 回传 → 告警 → 维护 闭环；</text><text x="28.0" y="532.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">试验评价用台架真值独立判定，避免“用自己的模型证明自己”。</text><text x="28.0" y="572.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">LoRa 功率 ≤10 dBm（433 MHz 免执照合规）；节点与终端均本地部署，不依赖云平台。</text></g></svg>
