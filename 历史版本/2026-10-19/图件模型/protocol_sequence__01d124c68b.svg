<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#142a30"/></marker></defs><rect width="1000" height="660" fill="white"/><g font-family="Microsoft YaHei,SimSun,sans-serif"><text x="28.0" y="44.0" font-size="30" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="start" fill="#142a30">确认与重试时序</text><text x="28.0" y="78.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">节点上报 → 网关 ACK → 超时重发 → 去重；断电重启后按序补发，帧长 55/57/24 B</text><rect x="130.0" y="100.0" width="180.0" height="56.0" rx="5" fill="#eaf1f7" stroke="#142a30" stroke-width="2"/><text x="220.0" y="136.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">节点</text><rect x="670.0" y="100.0" width="180.0" height="56.0" rx="5" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="760.0" y="136.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">网关 / 接收端</text><path d="M 220.0 156.0 L 220.0 560.0" fill="none" stroke="#52636a" stroke-width="2"/><path d="M 760.0 156.0 L 760.0 560.0" fill="none" stroke="#52636a" stroke-width="2"/><path d="M 220.0 200.0 L 760.0 200.0" fill="none" stroke="#142a30" stroke-width="2.2" marker-end="url(#ar)"/><text x="490.0" y="188.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">上报帧 EVT（55 B）</text><path d="M 760.0 260.0 L 220.0 260.0" fill="none" stroke="#142a30" stroke-width="2.2" marker-end="url(#ar)"/><text x="490.0" y="248.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#1d4a45">ACK（24 B）</text><path d="M 220.0 330.0 L 760.0 330.0" fill="none" stroke="#b8543f" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ar)"/><text x="490.0" y="318.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#b8543f">超时未收 ACK → 重发</text><path d="M 760.0 390.0 L 220.0 390.0" fill="none" stroke="#142a30" stroke-width="2.2" marker-end="url(#ar)"/><text x="490.0" y="378.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#1d4a45">ACK（去重后）</text><path d="M 220.0 470.0 L 760.0 470.0" fill="none" stroke="#142a30" stroke-width="2.2" marker-end="url(#ar)"/><text x="490.0" y="458.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">断电重启 → 按序补发</text><text x="28.0" y="596.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">重试上限与退避固定；同一事件 ID 幂等去重，避免重复告警。</text><text x="28.0" y="636.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">去重窗口与补发条数由固件常量约束。</text></g></svg>
