<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#142a30"/></marker></defs><rect width="1000" height="720" fill="white"/><g font-family="Microsoft YaHei,SimSun,sans-serif"><text x="28.0" y="44.0" font-size="30" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="start" fill="#142a30">台架测点与独立收集</text><text x="28.0" y="78.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">水路口径 Q 最上游；差压跨区段 R 两端取压；泄漏支路独立收集杯</text><path d="M 90.0 300.0 L 880.0 300.0" fill="none" stroke="#52636a" stroke-width="7" marker-end="url(#ar)"/><rect x="90.0" y="252.0" width="140.0" height="96.0" rx="5" fill="#eaf1f7" stroke="#142a30" stroke-width="2"/><text x="160.0" y="292.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">① Q</text><text x="160.0" y="324.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">流量计</text><rect x="250.0" y="252.0" width="140.0" height="96.0" rx="5" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="320.0" y="292.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">② P0</text><text x="320.0" y="324.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">取压嘴A</text><rect x="410.0" y="252.0" width="140.0" height="96.0" rx="5" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="480.0" y="292.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">③ R</text><text x="480.0" y="324.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">孔板+针阀</text><rect x="570.0" y="252.0" width="140.0" height="96.0" rx="5" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="640.0" y="292.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">④ P1</text><text x="640.0" y="324.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">取压嘴B</text><rect x="355.0" y="122.0" width="250.0" height="108.0" rx="5" fill="#ffffff" stroke="#b8543f" stroke-width="2"/><text x="480.0" y="152.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">差压变送器 MDM490</text><text x="480.0" y="184.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">0—40 kPa</text><text x="480.0" y="216.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">ΔP = P1 − P0</text><path d="M 320.0 252.0 L 320.0 176.0 L 353.0 176.0" fill="none" stroke="#b8543f" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#ar)"/><path d="M 640.0 252.0 L 640.0 176.0 L 607.0 176.0" fill="none" stroke="#b8543f" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#ar)"/><text x="320.0" y="210.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#b8543f">P0 干管参照</text><text x="640.0" y="210.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#b8543f">P1 支管</text><path d="M 710.0 300.0 L 710.0 470.0" fill="none" stroke="#52636a" stroke-width="7" marker-end="url(#ar)"/><path d="M 710.0 470.0 L 830.0 470.0" fill="none" stroke="#52636a" stroke-width="7" marker-end="url(#ar)"/><rect x="640.0" y="470.0" width="140.0" height="96.0" rx="5" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="710.0" y="510.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">⑤ A</text><text x="710.0" y="542.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">正常负载</text><rect x="820.0" y="470.0" width="140.0" height="96.0" rx="5" fill="#ffffff" stroke="#b8543f" stroke-width="2"/><text x="890.0" y="510.1" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="700" text-anchor="middle" fill="#142a30">⑥ 泄漏</text><text x="890.0" y="542.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="middle" fill="#142a30">独立收集</text><text x="28.0" y="620.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">图注：Q → P0 → ③R → P1 → ⑤A 正常负载 / ⑥泄漏独立收集（水路 Q 最上游）。</text><text x="28.0" y="660.0" font-size="23" font-family="Microsoft YaHei,SimSun,sans-serif" font-weight="400" text-anchor="start" fill="#52636a">差压表跨接 R 两端直接测 ΔP=P1−P0（量程/信号比由两表相减的 20—40 倍降到 4—8 倍）。</text></g></svg>
