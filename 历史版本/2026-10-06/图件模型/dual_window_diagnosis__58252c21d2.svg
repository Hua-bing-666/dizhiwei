Sun, sans-serif" font-size="24" font-weight="400" fill="#111">4处计数端点、3次压力观测</text><text x="245.0" y="399.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" font-weight="400" fill="#111">独立残差尺度与门限</text></g><g data-box="1" data-x="540" data-y="286" data-w="430" data-h="140"><rect x="540" y="286" width="430" height="140" rx="2" fill="white" stroke="#222" stroke-width="2"/><text x="755.0" y="331.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="26" font-weight="600" fill="#111">10秒主窗</text><text x="755.0" y="365.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" font-weight="400" fill="#111">11处计数端点、10次压力观测</text><text x="755.0" y="399.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" font-weight="400" fill="#111">健康参照与双通道门限</text></g><path d="M245,426 V464" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><path d="M755,426 V464" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><g data-box="1" data-x="30" data-y="464" data-w="430" data-h="90"><rect x="30" y="464" width="430" height="90" rx="2" fill="white" stroke="#222" stroke-width="2"/><text x="245.0" y="501.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="26" font-weight="600" fill="#111">连续2次出现正向越限</text><text x="245.0" y="535.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" font-weight="400" fill="#111">待复核提示</text></g><g data-box="1" data-x="540" data-y="464" data-w="430" data-h="90"><rect x="540" y="464" width="430" height="90" rx="2" fill="white" stroke="#222" stroke-width="2"/><text x="755.0" y="501.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="26" font-weight="600" fill="#111">连续5次同模式越限</text><text x="755.0" y="535.0" text-anchor="middle" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" font-we