<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">滴灌支管道故障诊断原型系统组成图</title>
  <desc id="desc">压力传感器和流量传感器向感知诊断节点提供测量数据。节点经LoRa发送数据至接收端，接收端通过串口连接本地巡检平台；平台确认信息沿原链路回传。节点连接LED或蜂鸣器用于报警指示，另预留执行器接口，不表示已完成实阀控制。台架及采集策略的研究安排见正文。</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5.5 L0,11 Z" fill="#222"/></marker>
    <style>
      text { font-family: SimSun, "Times New Roman", serif; font-size: 42px; fill: #111; text-anchor: middle; dominant-baseline: central; }
      .heading { font-size: 44px; }
      .latin { font-family: "Times New Roman", SimSun, serif; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; }
      .main { stroke-width: 2.5; }
      .link { fill: none; stroke: #222; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .reserved { stroke-dasharray: 10 8; }
    </style>
  </defs>
  <rect width="1800" height="720" fill="#fff"/>

  <g id="pressure" data-box="pressure" data-x="40" data-y="40" data-w="290" data-h="110">
    <rect class="box" x="40" y="40" width="290" height="110"/>
    <text x="185" y="95">压力传感器</text>
  </g>
  <g id="flow" data-box="flow" data-x="40" data-y="310" data-w="290" data-h="110">
    <rect class="box" x="40" y="310" width="290" height="110"/>
    <text x="185" y="365">流量传感器</text>
  </g>
  <g id="node" data-box="node" data-x="480" data-y="170" data-w="340" data-h="160">
    <rect class="box main" x="480" y="170" width="340" height="160"/>
    <text class="heading" x="650" y="215">感知诊断节点</text>
    <text x="650" y="282">采集与本地诊断</text>
  </g>
  <g id="receiver" data-box="receiver" data-x="990" data-y="170" data-w="300" data-h="160">
    <rect class="box main" x="990" y="170" width="300" height="160"/>
    <text class="heading" x="1140" y="215">LoRa接收端</text>
    <text x="1140" y="282">无线数据转接</text>
  </g>
  <g id="platform" data-box="platform" data-x="1420" data-y="170" data-w="340" data-h="160">
    <rect class="box main" x="1420" y="170" width="340" height="160"/>
    <text class="heading" x="1590" y="215">本地巡检平台</text>
    <text x="1590" y="282">监测与维护记录</text>
  </g>

  <path class="link" data-from="pressure" data-to="node" d="M330,95 H395 V215 H480"/>
  <path class="link" data-from="flow" data-to="node" d="M330,365 H395 V285 H480"/>
  <path class="link" data-from="node" data-to="receiver" d="M820,210 H990"/>
  <text class="latin" x="905" y="175">LoRa</text>
  <path class="link" data-from="receiver" data-to="node" d="M990,295 H820"/>
  <text class="latin" x="905" y="260">ACK</text>
  <path class="link" data-from="receiver" data-to="platform" d="M1290,210 H1420"/>
  <text x="1355" y="175">串口</text>
  <path class="link" data-from="platform" data-to="receiver" d="M1420,295 H1290"/>
  <text class="latin" x="1355" y="260">ACK</text>

  <g id="indicator" data-box="indicator" data-x="440" data-y="570" data-w="380" data-h="110">
    <rect class="box" x="440" y="570" width="380" height="110"/>
    <text x="630" y="625">LED/蜂鸣器</text>
  </g>
  <g id="actuator" data-box="actuator" data-x="920" data-y="570" data-w="440" data-h="110">
    <rect class="box reserved" x="920" y="570" width="440" height="110"/>
    <text x="1140" y="625">执行器接口（预留）</text>
  </g>
  <path class="link" data-from="node" data-to="indicator" d="M590,330 V570"/>
  <text x="690" y="510">报警指示</text>
  <path class="link reserved" data-from="node" data-to="actuator" d="M760,330 V470 H1140 V570"/>
  <text x="990" y="430">控制接口</text>
</svg>
