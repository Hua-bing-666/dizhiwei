<text x="530" y="1005">修订</text>
</g>
<path class="link" data-from="hardware-gate" data-to="hardware-fix" d="M410,1005 H470"/>
<text x="440" y="970">否</text>
<path class="link" data-from="hardware-fix" data-to="hardware-1" d="M530,950 V420 H440"/>
<text x="270" y="1110">是</text>
<g id="model-head" data-box="model-head" data-x="610" data-y="235" data-w="400" data-h="80">
<text x="810" y="275" class="heading">台架与水力模型</text>
</g>
<path class="link" data-from="overall" data-to="model-head" d="M900,180 V210 H810 V235"/>
<g id="model-1" data-box="model-1" data-x="610" data-y="350" data-w="400" data-h="140">
<rect class="box" x="610" y="350" width="400" height="140"/>
<text x="810" y="395" class="heading">台架与测点设计</text>
<text x="810" y="450">注入点与切换负载</text>
</g>
<path class="link" data-from="model-head" data-to="model-1" d="M810,315 V350"/>
<g id="model-2" data-box="model-2" data-x="610" data-y="540" data-w="400" data-h="140">
<rect class="box" x="610" y="540" width="400" height="140"/>
<text x="810" y="585" class="heading">水力建模与仿真</text>
<text x="810" y="640">健康参照与特征</text>
</g>
<path class="link" data-from="model-1" data-to="model-2" d="M810,490 V540"/>
<g id="model-3" data-box="model-3" data-x="610" data-y="730" data-w="400" data-h="140">
<rect class="box" x="610" y="730" width="400" height="140"/>
<text x="810" y="775" class="heading">模型标定与校验</text>
<text x="810" y="830">独立计量与误差</text>
</g>
<path class="link" data-from="model-2" data-to="model-3" d="M810,680 V730"/>
<g id="model-gate" data-box="model-gate" data-x="640" data-y="930" data-w="340" data-h="150">
<path class="box" d="M810,930 L980,1005 L810,1080 L640,1005 Z"/>
<text x="810" y="1005">满足要求</text>
</g>
<path class="link" data-from="model-3" data-to="model-gate" d="M810,870 V930"/>
<g id="model-fix" data-box="model-fix" data-x="1040" data-y="950" data-w="120" data-h="110">
<rect class="box" x="1040" y="950" width="120" height="110"/>
<text x="1100" y="1005">修订</text>
</g>
<path class="link" data-from="model-gate" data-to="model-fix" d="M980,1005 H1040"/>
<text x="1010" y="970">否</text>
<path class="link" data-from="model-fix" data-to="model-1" d="M1100,950 V420 H1010"/>
