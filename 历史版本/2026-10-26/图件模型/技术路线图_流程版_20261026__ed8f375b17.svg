</g>
<path class="link" data-from="final-gate" data-to="system-fix" d="M1120,2120 H1390"/>
<text x="1255" y="2085">否</text>
<path class="link feedback" data-from="system-fix" data-to="integration" d="M1730,2120 H1770 V1260 H1500"/>
<text x="1635" y="1215">重新联调</text>
<g id="outputs" data-box="outputs" data-x="300" data-y="2260" data-w="1200" data-h="110">
<rect class="box" x="300" y="2260" width="1200" height="110"/>
<text x="900" y="2315" class="heading">形成原型系统、实验数据与研究结论</text>
</g>
<path class="link" data-from="final-gate" data-to="outputs" d="M900,2200 V2260"/>
<text x="940" y="2230">是</text>
</svg>