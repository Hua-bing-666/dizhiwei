<g id="software-head" data-box="software-head" data-x="1180" data-y="235" data-w="400" data-h="80">
<text x="1380" y="275" class="heading">软件研制</text>
</g>
<path class="link" data-from="overall" data-to="software-head" d="M900,180 V210 H1380 V235"/>
<g id="software-1" data-box="software-1" data-x="1180" data-y="350" data-w="400" data-h="140">
<rect class="box" x="1180" y="350" width="400" height="140"/>
<text x="1380" y="395" class="heading">块级CUSUM判断</text>
<text x="1380" y="450">固定/触发采样策略</text>
</g>
<path class="link" data-from="software-head" data-to="software-1" d="M1380,315 V350"/>
<g id="software-2" data-box="software-2" data-x="1180" data-y="540" data-w="400" data-h="140">
<rect class="box" x="1180" y="540" width="400" height="140"/>
<text x="1380" y="585" class="heading">通信与平台开发</text>
<text x="1380" y="640">存储、核查与复测</text>
</g>
<path class="link" data-from="software-1" data-to="software-2" d="M1380,490 V540"/>
<g id="software-3" data-box="software-3" data-x="1180" data-y="730" data-w="400" data-h="140">
<rect class="box" x="1180" y="730" width="400" height="140"/>
<text x="1380" y="775" class="heading">主机回放测试</text>
<text x="1380" y="830">接口与异常处理</text>
</g>
<path class="link" data-from="software-2" data-to="software-3" d="M1380,680 V730"/>
<g id="software-gate" data-box="software-gate" data-x="1210" data-y="930" data-w="340" data-h="150">
<path class="box" d="M1380,930 L1550,1005 L1380,1080 L1210,1005 Z"/>
<text x="1380" y="1005">满足要求</text>
</g>
<path class="link" data-from="software-3" data-to="software-gate" d="M1380,870 V930"/>
<g id="software-fix" data-box="software-fix" data-x="1610" data-y="950" data-w="120" data-h="110">
<rect class="box" x="1610" y="950" width="120" height="110"/>
<text x="1670" y="1005">修订</text>
</g>
<path class="link" data-from="software-gate" data-to="software-fix" d="M1550,1005 H1610"/>
<text x="1580" y="970">否</text>
<path class="link" data-from="software-fix" data-to="software-1" d="M1670,950 V420 H1580"/>
<text x="1410" y="1110">是</text>
<g id="integration" data-box="integration" data-x="300" data-y="1190" data-w="1200" data-h="140">
<rect class="box main" x="300" y="1190" width="1200" height="140"/>
<text x="900" y="1235" class="stage">系统集成与逐级联调</text>
<text x="900" y="1290">板上采集—本地判断—LoRa传输—平台展示与核查</text>
</g>
<path class="link" data-from="hardware-gate" data-to="integration" d="M240,1080 V1140 H700 V1190"/>
<path class="link" data-from="model-gate" data-to="integration" d="M810,1080 V1190"/>
<path class="link" data-from="software-gate" data-to="integration" d="M1380,1080 V1140 H1100 V1190"/>
<g id="tuning" data-box="tuning" data-x="300" data-y="1390" data-w="1200" data-h="140">
<rect class="box main" x="300" y="1390" width="1200" height="140"/>
<text x="900" y="1435" class="stage">调参试验与参数冻结</text>
<text x="900" y="1490">同工况比较固定采样与事件触发策略，确定参照与门限</text>
</g>
<path class="link" data-from="integration" data-to="tuning" d="M900,1330 V1390"/>
<g id="validation" data-box="validation" data-x="180" data-y="1590" data-w="1440" data-h="190">
<rect class="box main" x="180" y="1590" width="1440" height="190"/>
<text x="900" y="1635" class="stage">独立台架对照验证</text>
<text x="900" y="1690">A支路等效泄漏与受限；健康、供压扰动及B支路切换作对照</text>
<text x="900" y="1740">独立操作记录与参考计量 · 使用未参与调参的数据批次</text>
</g>
<path class="link" data-from="tuning" data-to="validation" d="M900,1530 V1590"/>
<g id="evaluation" data-box="evaluation" data-x="300" data-y="1840" data-w="1200" data-h="140">
<rect class="box main" x="300" y="1840" width="1200" height="140"/>
<text x="900" y="1885" class="stage">性能评价与适用边界分析</text>
<text x="900" y="1940">检出、误报与时延 / 送达与恢复 / 采集及通信开销</text>
</g>
<path class="link" data-from="validation" data-to="evaluation" d="M900,1780 V1840"/>
<g id="final-gate" data-box="final-gate" data-x="680" data-y="2040" data-w="440" data-h="160">
<path class="box" d="M900,2040 L1120,2120 L900,2200 L680,2120 Z"/>
<text x="900" y="2120">满足研究要求？</text>
</g>
<path class="link" data-from="evaluation" data-to="final-gate" d="M900,1980 V2040"/>
<g id="system-fix" data-box="system-fix" data-x="1390" data-y="2050" data-w="340" data-h="140">
