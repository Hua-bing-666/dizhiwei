<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2410" viewBox="0 0 1800 2410" role="img" aria-labelledby="title desc">
<title id="title">滴灌支管道早期故障诊断原型系统技术路线图</title>
<desc id="desc">拟开展的研制与验证流程。总体方案后并行开展硬件、台架模型与软件研制，分支分别测试和修订，通过后集成联调。系统先开展调参试验并冻结参数，再用独立批次进行台架对照验证和性能评价。不满足研究要求时定位修订并重新联调，修订后使用新批次独立验证。图示项目实施安排，不代表硬件、无线或实测性能已经完成。虚线表示系统修订后的重新联调路径。</desc>
<defs><marker id="arrow" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5.5 L0,11 Z" fill="#222"/></marker>
<style>
text{font-family:SimSun,"Times New Roman",serif;font-size:42px;fill:#111;text-anchor:middle;dominant-baseline:central}
.heading{font-size:44px;font-weight:700}.stage{font-size:46px;font-weight:700}
.box{fill:#fff;stroke:#222;stroke-width:2}.main{stroke-width:2.6}
.link{fill:none;stroke:#222;stroke-width:2.1;stroke-linejoin:round;marker-end:url(#arrow)}
.feedback{stroke-dasharray:12 9}
</style></defs><rect width="1800" height="2410" fill="#fff"/>
<g id="overall" data-box="overall" data-x="300" data-y="40" data-w="1200" data-h="140">
<rect class="box main" x="300" y="40" width="1200" height="140"/>
<text x="900" y="85" class="stage">总体方案设计</text>
<text x="900" y="140">南疆棉田支管巡检：明确测点、故障定义与系统接口</text>
</g>
<g id="hardware-head" data-box="hardware-head" data-x="40" data-y="235" data-w="400" data-h="80">
<text x="240" y="275" class="heading">硬件研制</text>
</g>
<path class="link" data-from="overall" data-to="hardware-head" d="M900,180 V210 H240 V235"/>
<g id="hardware-1" data-box="hardware-1" data-x="40" data-y="350" data-w="400" data-h="140">
<rect class="box" x="40" y="350" width="400" height="140"/>
<text x="240" y="395" class="heading">传感与接口设计</text>
<text x="240" y="450">压力/压差与流量</text>
</g>
<path class="link" data-from="hardware-head" data-to="hardware-1" d="M240,315 V350"/>
<g id="hardware-2" data-box="hardware-2" data-x="40" data-y="540" data-w="400" data-h="140">
<rect class="box" x="40" y="540" width="400" height="140"/>
<text x="240" y="585" class="heading">节点与接收端制作</text>
<text x="240" y="640">存储与接口预留</text>
</g>
<path class="link" data-from="hardware-1" data-to="hardware-2" d="M240,490 V540"/>
<g id="hardware-3" data-box="hardware-3" data-x="40" data-y="730" data-w="400" data-h="140">
<rect class="box" x="40" y="730" width="400" height="140"/>
<text x="240" y="775" class="heading">采集标定与测试</text>
<text x="240" y="830">时序、计数与误差</text>
</g>
<path class="link" data-from="hardware-2" data-to="hardware-3" d="M240,680 V730"/>
<g id="hardware-gate" data-box="hardware-gate" data-x="70" data-y="930" data-w="340" data-h="150">
<path class="box" d="M240,930 L410,1005 L240,1080 L70,1005 Z"/>
<text x="240" y="1005">满足要求</text>
</g>
<path class="link" data-from="hardware-3" data-to="hardware-gate" d="M240,870 V930"/>
