<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><defs><linearGradient id="deep-field" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#164C45" /><stop offset="100%" stop-color="#092E2B" /></linearGradient></defs><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><rect id="header-mark" data-pptx-role="decoration" x="48" y="35" width="8" height="19" rx="0" fill="#164C45" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="68" y="51" font-size="16" fill="#556762">滴智卫 / 创新训练申报</text><text id="page-route-0" data-pptx-role="header" x="878" y="49" font-size="16" fill="#556762">场景</text><text id="page-route-1" data-pptx-role="header" x="961" y="49" font-size="16" fill="#556762">系统</text><rect id="route-highlight" data-pptx-role="decoration" x="1031" y="27" width="65" height="31" rx="4" fill="#EEF3EF" stroke="none" /><text id="page-route-2" data-pptx-role="header" x="1044" y="49" font-size="16" fill="#164C45">证据</text><text id="page-route-3" data-pptx-role="header" x="1127" y="49" font-size="16" fill="#556762">实施</text><g id="page-title" data-pptx-bounds="48 82 1184 78"><text x="48" y="126" font-size="42" fill="#164C45" text-anchor="start" font-weight="bold">相同观测，可能有不同原因</text></g><text id="source-footer" data-pptx-role="footer" x="48" y="686" font-size="16" fill="#556762">旧单点反例及双点模型；原因可辨识性依赖布点、操作信息与测量质量</text><text id="page-number" data-pptx-role="page-number" x="1232" y="686" text-anchor="end" font-size="16" fill="#556762">13/15</text><g id="cause-observation-ambiguity" data-pptx-bounds="48 180 1184 478"><rect x="48" y="204" width="333" height="95" rx="6" fill="#EEF3EF" stroke="none" /><text x="72" y="246" font-size="24" fill="#164C45" text-anchor="start" font-weight="bold">原因A：供压下降</text><text x="72" y="278" font-size="18" fill="#556762" text-anchor="start">旧单点模型</text><rect x="48" y="362" width="333" height="95" rx="6" fill="#F6ECE6" stroke="none" /><text x="72" y="404" font-size="24" fill="#B4512B" text-anchor="start" font-weight="bold">原因B：上游节流</text><text x="72" y="436" font-size="18" fill="#556762" text-anchor="start">可映射到同一测点观测</text><line x1="390" y1="253" x2="499" y2="330" stroke="#164C45" stroke-width="3" /><polygon points="499,330 488.1494397451931,328.1929742235362 493.6706755013851,320.3771989323034" fill="#164C45" stroke="none" stroke-width="1" /><line x1="390" y1="410" x2="499" y2="330" stroke="#B4512B" stroke-width="3" /><polygon points="499,330 493.8459389986206,339.7178009443526 488.1839693223527,332.0033672604376" fill="#B4512B" stroke="none" stroke-width="1" /><rect x="515" y="262" width="246" height="137" rx="6" fill="#164C45" stroke="none" /><text x="638" y="312" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="bold">相同 P / Q</text><text x="638" y="362" font-size="20" fill="#FFFFFF" text-anchor="middle">不等于相同原因</text><line x1="769" y1="330" x2="825" y2="330" stroke="#164C45" stroke-width="3" /><polygon points="825,330 815.0950818741205,334.78462087522354 815.0950818741205,325.21537912477646" fill="#164C45" stroke="none" stroke-width="1" /><text x="850" y="289" font-size="28" fill="#164C45" font-weight="bold">增加P0<tspan x="850" dy="41">有条件改善该歧义</tspan></text><rect x="48" y="505" width="1184" height="147" rx="6" fill="#EEF3EF" stroke="none" /><text x="71" y="544" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">双点仍有歧义：未知正常负载与等效泄漏可以同形。</text><text x="71" y="588" font-size="24" fill="#20332F" text-anchor="start">输出有限模式 / 待检查 / 数据无效；位置到监测支管或区段。</text><text x="71" y="625" font-size="20" fill="#556762" text-anchor="start">成立条件：信号可观测，参考可标定，操作可重复。</text></g></svg>
