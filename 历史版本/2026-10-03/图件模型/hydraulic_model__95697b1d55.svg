<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black"/></marker></defs><rect width="1000" height="660" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="black"><g data-kind="box" data-x="20" data-y="55" data-w="125" data-h="65"><rect x="20" y="55" width="125" height="65" fill="white" stroke="black" stroke-width="2"/><text x="82.5" y="96.0" font-size="25" font-weight="700" text-anchor="middle">供压Ps</text></g><path d="M 145 87 L 190 87 L 190 198 L 242 198" fill="none" stroke="black" stroke-width="2"/><g data-kind="box" data-x="242" data-y="166" data-w="150" data-h="65"><rect x="242" y="166" width="150" height="65" fill="white" stroke="black" stroke-width="2"/><text x="317.0" y="207.0" font-size="25" font-weight="700" text-anchor="middle">共同阻力Rc</text></g><path d="M 392 198 L 448 198 L 448 86 L 973 86" fill="none" stroke="black" stroke-width="2"/><path d="M 448 198 L 448 321 L 973 321" fill="none" stroke="black" stroke-width="2"/><circle cx="468" cy="86" r="26" fill="white" stroke="black" stroke-width="2"/><text x="468" y="94" font-size="24" font-weight="700" text-anchor="middle">P0</text><g data-kind="box" data-x="520" data-y="59" data-w="140" data-h="54"><rect x="520" y="59" width="140" height="54" fill="white" stroke="black" stroke-width="2"/><text x="590.0" y="94.5" font-size="25" font-weight="700" text-anchor="middle">A区段R</text></g><circle cx="718" cy="86" r="26" fill="white" stroke="black" stroke-width="2"/><text x="718" y="94" font-size="24" font-weight="700" text-anchor="middle">P1</text><circle cx="790" cy="86" r="26" fill="white" stroke="black" stroke-width="2"/><text x="790" y="94" font-size="24" font-weight="700" text-anchor="middle">Q</text><g data-kind="box" data-x="835" data-y="59" data-w="145" data-h="54"><rect x="835" y="59" width="145" height="54" fill="white" stroke="black" stroke-width="2"/><text x="907.5" y="94.5" font-size="25" font-weight="700" text-anchor="middle">正常负载Cₙ</text></g><path d="M 819 86 L 819 206 L 973 206" fill="none" stroke="black" stroke-width="2"/><g data-kind="box" data-x="835" data-y="179" data-w="145" data-h="54"><rect x="835" y="179" width="145" height="54" fill="white" stroke="black" stroke-width="2"/><text x="907.5" y="214.5" font-size="25" font-weight="700" text-anchor="middle">泄漏负载Cₗ</text></g><g data-kind="box" data-x="520" data-y="294" data-w="140" data-h="54"><rect x="520" y="294" width="140" height="54" fill="white" stroke="black" stroke-width="2"/><text x="590.0" y="329.5" font-size="25" font-weight="700" text-anchor="middle">B区段阻力</text></g><g data-kind="box" data-x="747" data-y="294" data-w="225" data-h="54"><rect x="747" y="294" width="225" height="54" fill="white" stroke="black" stroke-width="2"/><text x="859.5" y="329.5" font-size="25" font-weight="700" text-anchor="middle">B状态与正常负载</text></g><text x="190" y="280" font-size="23" font-weight="400" text-anchor="middle">共同供水压降</text><text x="190" y="314" font-size="23" font-weight="400" text-anchor="middle">由A、B总流量决定</text><g data-kind="box" data-x="20" data-y="401" data-w="960" data-h="114"><rect x="20" y="401" width="960" height="114" fill="white" stroke="black" stroke-width="2"/><text x="500.0" y="436.5" font-size="25" font-weight="700" text-anchor="middle">平方律等效关系与可解释特征</text><text x="500.0" y="467.5" font-size="23" font-weight="400" text-anchor="middle">P0 − P1 = R·Q²；Q = (Cₙ + Cₗ)·√P1</text><text x="500.0" y="497.5" font-size="23" font-weight="400" text-anchor="middle">K = Q/√P1；R̂ = (P0 − P1)/Q²</text></g><text x="22" y="546" font-size="23" font-weight="400" text-anchor="start">P单位kPa，Q单位L/min；R单位kPa/(L/min)²，C单位(L/min)/√kPa。</text><text x="22" y="580" font-size="23" font-weight="400" text-anchor="start">R增加模拟受限；Cₗ增加模拟泄漏。未知Cₙ增加可与泄漏同形。</text><text x="24" y="609" font-size="23" font-weight="400" text-anchor="start">未标定集中模型：非压力补偿负载、理想同步、单故障；不含水锤或CFD。</text><text x="24" y="640" font-size="23" font-weight="400" text-anchor="start">示意不代表管网尺寸或标定结果，实际压损与参数由清水试验核定。</text></g></svg>
