<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black"/></marker></defs><rect width="1000" height="850" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="black"><g data-kind="box" data-x="55" data-y="15" data-w="520" data-h="85"><rect x="55" y="15" width="520" height="85" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="51.0" font-size="25" font-weight="700" text-anchor="middle">启动与恢复</text><text x="315.0" y="82.0" font-size="23" font-weight="400" text-anchor="middle">载入配置、标定编号、会话及未确认队列</text></g><path d="M 315 100 L 315 123" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><g data-kind="box" data-x="55" data-y="123" data-w="520" data-h="85"><rect x="55" y="123" width="520" height="85" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="159.0" font-size="25" font-weight="700" text-anchor="middle">采集并记录采样时间</text><text x="315.0" y="190.0" font-size="23" font-weight="400" text-anchor="middle">P0 / P1分时ADC；Q脉冲与操作状态</text></g><path d="M 315 208 L 315 237" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 315 237.0 L 560.0 290 L 315 343.0 L 70.0 290 Z" fill="white" stroke="black" stroke-width="2"/><text x="315" y="283.5" font-size="23" font-weight="400" text-anchor="middle">量程、同步、缺测和</text><text x="315" y="312.5" font-size="23" font-weight="400" text-anchor="middle">非物理读数检查通过？</text><path d="M 560 290 L 670 290" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="596.5" y="256" width="33" height="28" fill="white"/><text x="613" y="278" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="670" data-y="246" data-w="305" data-h="88"><rect x="670" y="246" width="305" height="88" fill="white" stroke="black" stroke-width="2"/><text x="822.5" y="283.5" font-size="25" font-weight="700" text-anchor="middle">标记数据无效</text><text x="822.5" y="314.5" font-size="23" font-weight="400" text-anchor="middle">记录原因；停止原因判断</text></g><path d="M 315 343 L 315 373" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="328.5" y="344" width="33" height="28" fill="white"/><text x="345" y="366" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="55" data-y="373" data-w="520" data-h="87"><rect x="55" y="373" width="520" height="87" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="410.0" font-size="25" font-weight="700" text-anchor="middle">换算与计数窗口对齐</text><text x="315.0" y="441.0" font-size="23" font-weight="400" text-anchor="middle">保留原始值；换算P0 / P1 / Q</text></g><path d="M 315 460 L 315 488" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 315 488.0 L 560.0 544 L 315 600.0 L 70.0 544 Z" fill="white" stroke="black" stroke-width="2"/><text x="315" y="537.5" font-size="23" font-weight="400" text-anchor="middle">阀态和工况已知，</text><text x="315" y="566.5" font-size="23" font-weight="400" text-anchor="middle">且切换等待条件满足？</text><path d="M 560 544 L 670 544" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="596.5" y="510" width="33" height="28" fill="white"/><text x="613" y="532" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="670" data-y="500" data-w="305" data-h="88"><rect x="670" y="500" width="305" height="88" fill="white" stroke="black" stroke-width="2"/><text x="822.5" y="537.5" font-size="25" font-weight="700" text-anchor="middle">切换或状态未知</text><text x="822.5" y="568.5" font-size="23" font-weight="400" text-anchor="middle">保留趋势；异常待检查</text></g><path d="M 315 600 L 315 627" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="328.5" y="599" width="33" height="28" fill="white"/><text x="345" y="621" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="55" data-y="627" data-w="520" data-h="85"><rect x="55" y="627" width="520" height="85" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="663.0" font-size="25" font-weight="700" text-anchor="middle">提交诊断输入</text><text x="315.0" y="694.0" font-size="23" font-weight="400" text-anchor="middle">有效测量 / 状态 / 时间 / 健康参照编号</text></g><path d="M 315 712 L 315 742" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><g data-kind="box" data-x="55" data-y="742" data-w="520" data-h="60"><rect x="55" y="742" width="520" height="60" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="780.5" font-size="25" font-weight="700" text-anchor="middle">原始日志追加后进入下一采集周期</text></g><path d="M 975 290 L 988 290 L 988 772 L 575 772" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 975 544 L 988 544" fill="none" stroke="black" stroke-width="2"/><path d="M 55 772 L 23 772 L 23 163 L 55 163" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="24" y="830" font-size="23" font-weight="400" text-anchor="start">拟实施流程；等待段仍评价漏检与误报，原始记录不因筛选而删除。</text></g></svg>
