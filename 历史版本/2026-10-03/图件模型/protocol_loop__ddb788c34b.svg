<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black"/></marker></defs><rect width="1000" height="875" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="black"><text x="255" y="31" font-size="26" font-weight="700" text-anchor="middle">感知节点与本地事件队列</text><text x="760" y="31" font-size="26" font-weight="700" text-anchor="middle">接收端与本地管理软件</text><g data-kind="box" data-x="25" data-y="59" data-w="455" data-h="90"><rect x="25" y="59" width="455" height="90" fill="white" stroke="black" stroke-width="2"/><text x="252.5" y="97.5" font-size="25" font-weight="700" text-anchor="middle">新事件写入待确认队列</text><text x="252.5" y="128.5" font-size="23" font-weight="400" text-anchor="middle">设备 / 会话 / 序号 / 发生时间 / 证据</text></g><path d="M 252 149 L 252 178" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><g data-kind="box" data-x="25" data-y="178" data-w="455" data-h="85"><rect x="25" y="178" width="455" height="85" fill="white" stroke="black" stroke-width="2"/><text x="252.5" y="214.0" font-size="25" font-weight="700" text-anchor="middle">发送队首事件并记录发送时间</text><text x="252.5" y="245.0" font-size="23" font-weight="400" text-anchor="middle">断链保留待补发状态与原始日志</text></g><path d="M 480 215 L 540 215" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="482.0" y="173" width="56" height="28" fill="white"/><text x="510" y="195" font-size="23" font-weight="400" text-anchor="middle">事件</text><g data-kind="box" data-x="540" data-y="178" data-w="440" data-h="85"><rect x="540" y="178" width="440" height="85" fill="white" stroke="black" stroke-width="2"/><text x="760.0" y="214.0" font-size="25" font-weight="700" text-anchor="middle">接收并检查格式与事件身份</text><text x="760.0" y="245.0" font-size="23" font-weight="400" text-anchor="middle">设备 + 会话 + 序号联合识别</text></g><path d="M 760 263 L 760 284" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 760 284.0 L 960.0 332 L 760 380.0 L 560.0 332 Z" fill="white" stroke="black" stroke-width="2"/><text x="760" y="340.0" font-size="23" font-weight="400" text-anchor="middle">已持久化的重复事件？</text><path d="M 760 380 L 760 410" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="773.5" y="378" width="33" height="28" fill="white"/><text x="790" y="400" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="540" data-y="410" data-w="440" data-h="85"><rect x="540" y="410" width="440" height="85" fill="white" stroke="black" stroke-width="2"/><text x="760.0" y="446.0" font-size="25" font-weight="700" text-anchor="middle">先持久化再发送事件ACK</text><text x="760.0" y="477.0" font-size="23" font-weight="400" text-anchor="middle">唯一记录；接收时间与错误日志</text></g><path d="M 960 332 L 991 332 L 991 518 L 760 518" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="961.5" y="293" width="33" height="28" fill="white"/><text x="978" y="315" font-size="23" font-weight="400" text-anchor="middle">是</text><rect x="823.5" y="506" width="115" height="28" fill="white"/><text x="881" y="528" font-size="23" font-weight="400" text-anchor="middle">重复仍ACK</text><path d="M 760 495 L 760 518" fill="none" stroke="black" stroke-width="2"/><g data-kind="box" data-x="540" data-y="544" data-w="440" data-h="85"><rect x="540" y="544" width="440" height="85" fill="white" stroke="black" stroke-width="2"/><text x="760.0" y="580.0" font-size="25" font-weight="700" text-anchor="middle">记录已接收事件并呈现趋势</text><text x="760.0" y="611.0" font-size="23" font-weight="400" text-anchor="middle">ACK只确认存储；处理确认另记</text></g><path d="M 760 518 L 760 544" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 760 518 L 500 518 L 500 332 L 450 332" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="477.0" y="422" width="46" height="28" fill="white"/><text x="500" y="444" font-size="23" font-weight="400" text-anchor="middle">ACK</text><path d="M 252 263 L 252 284" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 252 284.0 L 449.5 332 L 252 380.0 L 54.5 332 Z" fill="white" stroke="black" stroke-width="2"/><text x="252" y="340.0" font-size="23" font-weight="400" text-anchor="middle">超时前收到匹配ACK？</text><path d="M 252 380 L 252 410" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="263.5" y="379" width="33" height="28" fill="white"/><text x="280" y="401" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="25" data-y="410" data-w="455" data-h="85"><rect x="25" y="410" width="455" height="85" fill="white" stroke="black" stroke-width="2"/><text x="252.5" y="446.0" font-size="25" font-weight="700" text-anchor="middle">确认完成并移除对应队列项</text><text x="252.5" y="477.0" font-size="23" font-weight="400" text-anchor="middle">记录确认时间；准备下一事件</text></g><path d="M 55 332 L 10 332 L 10 567 L 25 567" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><rect x="9.5" y="371" width="33" height="28" fill="white"/><text x="26" y="393" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="25" data-y="530" data-w="455" data-h="114"><rect x="25" y="530" width="455" height="114" fill="white" stroke="black" stroke-width="2"/><text x="252.5" y="565.5" font-size="25" font-weight="700" text-anchor="middle">记录超时并限次退避重试</text><text x="252.5" y="596.5" font-size="23" font-weight="400" text-anchor="middle">本轮重试耗尽仍保留待确认状态</text><text x="252.5" y="626.5" font-size="23" font-weight="400" text-anchor="middle">恢复后的再次发送规则由实测冻结</text></g><path d="M 252 530 L 252 507 L 490 507 L 490 165 L 252 165 L 252 178" fill="none" stroke="black" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><g data-kind="box" data-x="25" data-y="675" data-w="955" data-h="114"><rect x="25" y="675" width="955" height="114" fill="white" stroke="black" stroke-width="2"/><text x="502.5" y="710.5" font-size="25" font-weight="700" text-anchor="middle">异常与恢复检查</text><text x="502.5" y="741.5" font-size="23" font-weight="400" text-anchor="middle">队列满：明确记录丢弃或拒绝及缺口；重启：恢复队列或明确标记丢失</text><text x="502.5" y="771.5" font-size="23" font-weight="400" text-anchor="middle">离线显示 / ACK丢失后的重复接收 / 会话唯一性 / 处理确认均需实测</text></g><text x="24" y="824" font-size="23" font-weight="400" text-anchor="start">拟实施协议；缓存、掉电策略、超时、重试和空中时间由无线试验核定。</text><text x="24" y="855" font-size="23" font-weight="400" text-anchor="start">模型回放参数不是固件定值；远端接收时间与管理确认时间分别保存。</text></g></svg>
