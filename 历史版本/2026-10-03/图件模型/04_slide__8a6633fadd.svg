ont-size="24" fill="#20332F" text-anchor="start">渐进故障 → 状态 / 强基线 → 程度与提前量</text><line x1="171" y1="389" x2="1232" y2="389" stroke="#C7D2CB" stroke-width="1" /><text x="48" y="465" font-size="60" fill="#164C45" text-anchor="start">03</text><text x="171" y="436" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">WP3 可靠告警</text><text x="171" y="480" font-size="24" fill="#20332F" text-anchor="start">固定采样 → 周期/事件公平对照 → ACK / 整机测量</text><line x1="171" y1="501" x2="1232" y2="501" stroke="#C7D2CB" stroke-width="1" /><text x="48" y="577" font-size="60" fill="#164C45" text-anchor="start">04</text><text x="171" y="548" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">WP4 系统与验证</text><text x="171" y="592" font-size="24" fill="#20332F" text-anchor="start">节点 / 管理软件 / 台架 → 独立实测 → 数据与报告</text><line x1="171" y1="613" x2="1232" y2="613" stroke="#C7D2CB" stroke-width="1" /></g></svg>
