<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black"/></marker></defs><rect width="1000" height="650" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif" fill="black"><g data-kind="box" data-x="30" data-y="30" data-w="570" data-h="85"><rect x="30" y="30" width="570" height="85" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="66.0" font-size="25" font-weight="700" text-anchor="middle">测量质量与运行状态检查</text><text x="315.0" y="97.0" font-size="23" font-weight="400" text-anchor="middle">对齐P0/P1/Q；采用冻结的同工况参照</text></g><path d="M 315 115 L 315 145" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 315 145.0 L 600.0 193 L 315 241.0 L 30.0 193 Z" fill="white" stroke="black" stroke-width="2"/><text x="315" y="201.0" font-size="23" font-weight="400" text-anchor="middle">有效、状态明确且可计算？</text><path d="M 600 193 L 680 193" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="638" y="174" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="680" data-y="150" data-w="290" data-h="85"><rect x="680" y="150" width="290" height="85" fill="white" stroke="black" stroke-width="2"/><text x="825.0" y="186.0" font-size="25" font-weight="700" text-anchor="middle">无效或暂缓判断</text><text x="825.0" y="217.0" font-size="23" font-weight="400" text-anchor="middle">保留原始值及原因</text></g><path d="M 315 241 L 315 274" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="349" y="263" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="30" data-y="274" data-w="570" data-h="114"><rect x="30" y="274" width="570" height="114" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="309.5" font-size="25" font-weight="700" text-anchor="middle">计算与持续偏离检验</text><text x="315.0" y="340.5" font-size="23" font-weight="400" text-anchor="middle">K = Q/√P1；R̂ = (P0−P1)/Q²</text><text x="315.0" y="370.5" font-size="23" font-weight="400" text-anchor="middle">结合误差区间与冻结阈值</text></g><path d="M 315 388 L 315 420" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 315 420.0 L 600.0 470 L 315 520.0 L 30.0 470 Z" fill="white" stroke="black" stroke-width="2"/><text x="315" y="478.0" font-size="23" font-weight="400" text-anchor="middle">偏离持续，且模式证据充分？</text><path d="M 600 470 L 680 470" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="638" y="450" font-size="23" font-weight="400" text-anchor="middle">否</text><g data-kind="box" data-x="680" data-y="425" data-w="290" data-h="90"><rect x="680" y="425" width="290" height="90" fill="white" stroke="black" stroke-width="2"/><text x="825.0" y="463.5" font-size="25" font-weight="700" text-anchor="middle">继续记录或待检查</text><text x="825.0" y="494.5" font-size="23" font-weight="400" text-anchor="middle">区分未异常与原因不明</text></g><path d="M 315 520 L 315 548" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="349" y="541" font-size="23" font-weight="400" text-anchor="middle">是</text><g data-kind="box" data-x="30" data-y="548" data-w="570" data-h="85"><rect x="30" y="548" width="570" height="85" fill="white" stroke="black" stroke-width="2"/><text x="315.0" y="584.0" font-size="25" font-weight="700" text-anchor="middle">有限故障模式与事件摘要</text><text x="315.0" y="615.0" font-size="23" font-weight="400" text-anchor="middle">等效泄漏 / 等效受限；保存首次提示时间</text></g></g></svg>
