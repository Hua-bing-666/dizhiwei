<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">文献依据与拟研究差异</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">研究增量落在动态工况与可靠告警</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">文献：AWM 2022；Sensors 2026 HydroNeuro；Land 2026；Sensors 2021；IFAC 2025。完整DOI见备用页。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">03 / 15</text><g id="research-position" data-pptx-bounds="48 175 1184 449"><text x="48" y="217" font-size="28" fill="#164C45" text-anchor="start">间接检测的边界</text><text x="690" y="217" font-size="18" fill="#556762" text-anchor="start">滴灌堵塞综述（2022）</text><line x1="48" y1="237" x2="1232" y2="237" stroke="#C7D2CB" stroke-width="1" /><text x="48" y="283" font-size="24" fill="#20332F">限定低成本测点可观测范围，不承诺逐滴头早期诊断</text><text x="48" y="356" font-size="28" fill="#164C45" text-anchor="start">阀态建模已有先例</text><text x="690" y="356" font-size="18" fill="#556762" text-anchor="start">HydroNeuro（2026）</text><line x1="48" y1="376" x2="1232" y2="376" stroke="#C7D2CB" stroke-width="1" /><text x="48" y="422" font-size="24" fill="#20332F">检验连续切换与短时异常，不把状态辅助直接当作创新</text><text x="48" y="495" font-size="28" fill="#164C45" text-anchor="start">平台和事件通信已有研究</text><text x="690" y="495" font-size="18" fill="#556762" text-anchor="start">灌溉平台（2026）；农业通信（2021/2025）</text><line x1="48" y1="515" x2="1232" y2="515" stroke="#C7D2CB" stroke-width="1" /><text x="48" y="561" font-size="24" fill="#20332F">增加强周期对照与相同告警确认，评价取舍而非预设优越</text></g></svg>
