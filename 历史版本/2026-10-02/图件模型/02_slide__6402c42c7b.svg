<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">研究问题</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">正常操作与异常可能同时改变测量</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">研究计划：实物、真实无线和田间证据尚未完成；所有指标及扩展按正式任务书冻结。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">02 / 15</text><g id="problem-comparison" data-pptx-bounds="48 178 1184 452"><text x="48" y="210" font-size="30" fill="#164C45" text-anchor="start">一组测量，两类来源</text><rect x="48" y="246" width="566" height="171" rx="0" fill="#EEF3EF" stroke="none" /><text x="74" y="290" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">正常运行</text><text x="74" y="341" font-size="24" fill="#20332F">支路开关、供压调整、负载改变</text><rect x="648" y="246" width="584" height="171" rx="0" fill="#F4ECE5" stroke="none" /><text x="674" y="290" font-size="28" fill="#B4512B" text-anchor="start" font-weight="bold">需要检查的异常</text><text x="674" y="341" font-size="24" fill="#20332F">可控泄漏、水力受限、切换期短时异常</text><text x="48" y="488" font-size="28" fill="#164C45">感知问题：正常扰动中能否看见显著异常？</text><text x="48" y="558" font-size="28" fill="#164C45">通信问题：有限上报下能否保留并送达短时告警？</text></g></svg>
