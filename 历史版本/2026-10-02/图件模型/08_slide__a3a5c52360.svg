<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">合成挑战检验</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">反例决定边界，而不是被隐藏</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">来源：audit_results/audit.json 与 communication_results/summary.json；合成重复不是实际识别率。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">08 / 15</text><g id="failure-boundaries" data-pptx-bounds="48 175 1184 467"><text x="48" y="260" font-size="60" fill="#B4512B" text-anchor="start" font-weight="bold">0 / 20</text><text x="383" y="250" font-size="30" fill="#164C45" text-anchor="start">弱等效泄漏未被命中</text><text x="383" y="300" font-size="24" fill="#20332F" text-anchor="start">这是检测边界，不是通信重传能够补救的问题。</text><line x1="48" y1="336" x2="1232" y2="336" stroke="#C7D2CB" stroke-width="1" /><text x="48" y="394" font-size="28" fill="#B4512B" text-anchor="start">信息缺失</text><text x="282" y="394" font-size="24" fill="#20332F" text-anchor="start">无阀态正常切换：平均1次误报/试次</text><text x="48" y="459" font-size="28" fill="#B4512B" text-anchor="start">较大噪声</text><text x="282" y="459" font-size="24" fill="#20332F" text-anchor="start">候选检测：平均2.7次误报/试次</text><text x="48" y="524" font-size="28" fill="#B4512B" text-anchor="start">链路中断</text><text x="282" y="524" font-size="24" fill="#20332F">30%随机丢包＋15秒阻断，仍有短时告警超过20秒演示约束</text><text x="48" y="622" font-size="28" fill="#164C45" text-anchor="start">保留失败案例与强基线，按实际证据确定研究增量。</text></g></svg>
