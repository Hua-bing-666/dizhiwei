<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="ending" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">预期成果与立项目标</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">用系统成果结项，用研究证据支撑论文</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">研究计划：实物、真实无线和田间证据尚未完成；所有指标及扩展按正式任务书冻结。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">12 / 15</text><g id="project-deliverables" data-pptx-bounds="48 175 1184 467"><text x="48" y="232" font-size="30" fill="#164C45" text-anchor="start" font-weight="bold">系统交付</text><text x="48" y="286" font-size="28" fill="#20332F" text-anchor="start">1节点 + 1接收端 + 1套双支路台架</text><text x="48" y="370" font-size="30" fill="#164C45" text-anchor="start" font-weight="bold">研究证据</text><text x="48" y="423" font-size="28" fill="#20332F">标定/标签数据、检测/通信对照、复现软件、报告与论文稿</text><rect x="48" y="523" width="1184" height="102" rx="0" fill="#164C45" stroke="none" /><text x="75" y="567" font-size="28" fill="#FFFFFF" text-anchor="start">争取国家级：以问题、增量、证据与真实条件支撑。</text><text x="75" y="604" font-size="24" fill="#FFFFFF" text-anchor="start">已有成果据实陈述；研究目标以实验兑现。</text></g></svg>
