<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">模型反例｜非实测</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">备用｜单测点不等于故障原因诊断</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">来源：audit_results/audit.json 的结构性反例；参数化等效模型，不代表每条实际管路。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">13 / 15</text><g id="observability-boundary" data-pptx-bounds="48 175 1184 467"><text x="48" y="255" font-family="SimHei, Arial" font-size="42" fill="#B4512B" text-anchor="start">相同压力 / 流量 ≠ 相同故障原因</text><text x="48" y="335" font-size="28" fill="#20332F">上游节流与供压下降可映射到相同测点观测。</text><text x="48" y="418" font-size="28" fill="#164C45">主要输出“异常、建议检查”；分类仅限有独立证据的工况。</text><text x="48" y="504" font-size="24" fill="#20332F">共同阻力为零时，B支路切换也可不影响A测点。</text><text x="48" y="602" font-size="28" fill="#164C45" text-anchor="start">成立条件：信号可观测、参考可标定、操作可重复。</text></g></svg>
