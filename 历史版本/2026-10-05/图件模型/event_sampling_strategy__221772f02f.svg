ght="110" rx="3" fill="white" stroke="#202020" stroke-width="2"/><text x="240.0" y="681.0" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="700">保留诊断与巡检记录</text><text x="240.0" y="713.0" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="400">证据不足不自动请求</text><text x="240.0" y="745.0" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="400">继续采集 / 人工检查</text></g><g data-box="true" data-x="580" data-y="650" data-w="360" data-h="110"><rect x="580" y="650" width="360" height="110" rx="3" fill="white" stroke="#202020" stroke-width="2"/><text x="760.0" y="681.0" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="700">生成模拟请求与唯一序号</text><text x="760.0" y="713.0" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="400">演示输出 / 反馈记录</text><text x="760.0" y="745.0" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="400">人工复位</text></g><path d="M 500 585 L 500 615 L 240 615 L 240 650" fill="none" stroke="#202020" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="604" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="400">否</text><path d="M 500 585 L 500 615 L 760 615 L 760 650" fill="none" stroke="#202020" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="604" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="middle" font-weight="400">是</text><path d="M 900 605 L 900 650" fill="none" stroke="#202020" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="635" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="start" font-weight="400">人工</text><text x="20" y="810" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="start" font-weight="400">周期候选经对照试验选择；确认按经过时间与真实观测次数计算。</text><text x="20" y="850" fill="#151515" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="24" text-anchor="start" font-weight="400">模拟反馈不代表阀门关闭；无实物时只记录请求与演示状态。</text></svg>