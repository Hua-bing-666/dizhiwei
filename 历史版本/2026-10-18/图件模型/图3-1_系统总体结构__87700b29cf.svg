<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#142a30"/></marker></defs><rect width="1000" height="650" fill="white"/><g font-family="Microsoft YaHei, SimSun, sans-serif"><rect x="25.0" y="40.0" width="290.0" height="250.0" rx="4" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="37.0" y="77.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="start" fill="#142a30">① 感知诊断节点</text><text x="37.0" y="109.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">差压 P1 / 干管参照 P0</text><text x="37.0" y="141.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">脉冲流量 Q</text><text x="37.0" y="173.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">本地特征 + 分块判据</text><text x="37.0" y="205.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">microSD 事件日志</text><text x="37.0" y="237.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">GD32F103CBT6</text><text x="37.0" y="269.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">内置 12 位 ADC</text><rect x="405.0" y="40.0" width="200.0" height="250.0" rx="4" fill="#ffffff" stroke="#142a30" stroke-width="2"/><text x="417.0" y="109.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="start" fill="#142a30">② LoRa 接收端</text><text x="417.0" y="141.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">E220-400T22D</text><text x="417.0" y="173.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">3.3 V 逻辑</text><text x="417.0" y="205.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">USB-TTL 转换</text><text x="417.0" y="237.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">接入计算机</text><rect x="695.0" y="40.0" width="280.0" height="250.0" rx="4" fill="#eaf1f7" stroke="#142a30" stroke-width="2"/><text x="707.0" y="109.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="start" fill="#142a30">③ 本地巡检平台</text><text x="707.0" y="141.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">接收服务：校验 / 去重</text><text x="707.0" y="173.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">写库并回复确认（ACK）</text><text x="707.0" y="205.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">Web：趋势 / 证据</text><text x="707.0" y="237.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">处置 / 人工复测</text><path d="M 315.0 160.0 L 405.0 160.0" fill="none" stroke="#142a30" stroke-width="2.0" marker-end="url(#ar)"/><text x="360.0" y="146.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">LoRa</text><path d="M 605.0 160.0 L 695.0 160.0" fill="none" stroke="#142a30" stroke-width="2.0" marker-end="url(#ar)"/><text x="650.0" y="146.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">UART</text><path d="M 835.0 290.0 L 835.0 326.0 L 200.0 326.0 L 200.0 290.0" fill="none" stroke="#142a30" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="369.2" y="296" width="261.6" height="32" fill="#ffffff"/><text x="500.0" y="320.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="middle" fill="#52636a">事件确认与重传（ACK）</text><rect x="25.0" y="370.0" width="950.0" height="170.0" rx="4" fill="#eef5f2" stroke="#142a30" stroke-width="2"/><text x="37.0" y="412.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="700" text-anchor="start" fill="#142a30">④ 双支路清水台架（向 ① 提供健康标定与故障注入工况）</text><text x="37.0" y="446.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">A 支路：Q → P0 → 受限 R → P1，末端分正常出流与泄漏旁路</text><text x="37.0" y="480.1" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">B 支路：切换阀 + 可调负载，模拟另一支管轮灌</text><text x="37.0" y="514.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">泄漏旁路经独立容器计量，用于误报与检出对照</text><path d="M 120.0 370.0 L 120.0 290.0" fill="none" stroke="#142a30" stroke-width="2.0" marker-end="url(#ar)"/><text x="25.0" y="578.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#142a30">注：①②③④ 与正文「四部分组成」一一对应；接收端不参与诊断决策。</text><text x="25.0" y="616.0" font-size="23" font-family="Microsoft YaHei, SimSun, sans-serif" font-weight="400" text-anchor="start" fill="#52636a">实线为测量与业务数据流，虚线为事件确认回传；台架为验证条件，不属田间部署范围。</text></g></svg>
