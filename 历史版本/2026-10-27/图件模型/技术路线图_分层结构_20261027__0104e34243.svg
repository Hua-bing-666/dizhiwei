<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2090" viewBox="0 0 1800 2090" data-print-width-mm="150" role="img" aria-labelledby="title desc">
<title id="title">滴灌支管异常识别技术路线</title>
<desc id="desc">拟开展的研究路线，按建模与测量依据、判据与采样方法、独立验证与边界评价组织。水力模型和独立健康标定共同支撑参照残差、不重叠块特征与CUSUM判据。固定采样与事件触发策略在同一判据下对照，输出采样及上报配置；候选事件经LoRa上报、落库确认及人工复测形成核查链。参数冻结后，以双支路台架、独立计量与操作记录开展独立验证，再与单阈值和固定采样基线比较。虚线外框为研究环节分区，不表示新增系统设备。图示研究计划，不表示实测结论已完成。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#222"/></marker>
<style>
text{font-family:SimSun,"Times New Roman",serif;font-size:41px;fill:#111;text-anchor:middle;dominant-baseline:central}
.key{font-size:44px;font-weight:700}.section-title{font-size:44px;font-weight:700;text-anchor:start}
.box{fill:#fff;stroke:#222;stroke-width:1.7}.primary{stroke-width:2.2}
.section{fill:none;stroke:#858585;stroke-width:1.3;stroke-dasharray:9 7}
.link{fill:none;stroke:#222;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}
.main{stroke-width:2.2}
</style></defs><rect width="1800" height="2090" fill="#fff"/>
<rect class="section" x="40" y="40" width="1720" height="450"/>
<rect x="80" y="12" width="360" height="58" fill="#fff"/>
<text class="section-title" x="100" y="40">建模与测量依据</text>
<rect class="section" x="40" y="590" width="1720" height="710"/>
<rect x="80" y="562" width="360" height="58" fill="#fff"/>
<text class="section-title" x="100" y="590">判据与采样方法</text>
<rect class="section" x="40" y="1400" width="1720" height="650"/>
<rect x="80" y="1372" width="410" height="58" fill="#fff"/>
<text class="section-title" x="100" y="1400">试验验证与边界评价</text>
<g id="faults" data-box="faults" data-x="90" data-y="130" data-w="340" data-h="100"><rect class="box" x="90" y="130" width="340" height="100"/>
<text x="260" y="180">泄漏与区段受限</text>
</g>
<g id="disturbances" data-box="disturbances" data-x="500" data-y="130" data-w="380" data-h="100"><rect class="box" x="500" y="130" width="380" height="100"/>
<text x="690" y="180">供压与支路切换</text>
</g>
<g id="model" data-box="model" data-x="220" data-y="300" data-w="600" data-h="140"><rect class="box primary" x="220" y="300" width="600" height="140"/>
<text x="520" y="345" class="key">水力建模与归一化特征</text>
<text x="520" y="400">压力—流量关系及区段阻力</text>
</g>
<path class="link" data-from="faults" data-to="model" d="M260,230 V265 H400 V300"/>
<path class="link" data-from="disturbances" data-to="model" d="M690,230 V265 H640 V300"/>
<g id="healthy-data" data-box="healthy-data" data-x="1160" data-y="130" data-w="480" data-h="100"><rect class="box" x="1160" y="130" width="480" height="100"/>
<text x="1400" y="180">独立健康工况测量</text>
</g>
<g id="calibration" data-box="calibration" data-x="1100" data-y="300" data-w="600" data-h="140"><rect class="box" x="1100" y="300" width="600" height="140"/>
<text x="1400" y="345">测量标定与误差分析</text>
<text x="1400" y="400">建立健康水力参照</text>
</g>
<path class="link" data-from="healthy-data" data-to="calibration" d="M1400,230 V300"/>
<g id="features" data-box="features" data-x="190" data-y="690" data-w="660" data-h="110"><rect class="box primary" x="190" y="690" width="660" height="110"/>
<text x="520" y="745" class="key">参照残差与不重叠块特征</text>
</g>
<path class="link main" data-from="model" data-to="features" d="M520,440 V690"/>
<path class="link" data-from="calibration" data-to="features" d="M1400,440 V560 H720 V690"/>
<g id="diagnosis" data-box="diagnosis" data-x="190" data-y="890" data-w="660" data-h="110"><rect class="box primary" x="190" y="890" width="660" height="110"/>
<text x="520" y="945" class="key">块级CUSUM与切换复判</text>
</g>
<path class="link main" data-from="features" data-to="diagnosis" d="M520,800 V890"/>
<g id="fixed-sampling" data-box="fixed-sampling" data-x="1155" data-y="690" data-w="420" data-h="100"><rect class="box" x="1155" y="690" width="420" height="100"/>
<text x="1365" y="740">固定采样基线</text>
</g>
<g id="adaptive-sampling" data-box="adaptive-sampling" data-x="1040" data-y="890" data-w="650" data-h="110"><rect class="box primary" x="1040" y="890" width="650" height="110"/>
<text x="1365" y="945" class="key">事件触发采样对照</text>
</g>
<path class="link" data-from="fixed-sampling" data-to="adaptive-sampling" d="M1365,790 V890"/>
<path class="link" data-from="diagnosis" data-to="adaptive-sampling" d="M850,945 H1040"/>
<text x="945" y="910">统一判据</text>
<g id="warning" data-box="warning" data-x="190" data-y="1090" data-w="660" data-h="140"><rect class="box" x="190" y="1090" width="660" height="140"/>
<text x="520" y="1135">异常候选与可核查告警</text>
<text x="520" y="1190">LoRa上报、确认与人工复测</text>
</g>
<path class="link main" data-from="diagnosis" data-to="warning" d="M520,1000 V1090"/>
<g id="sampling-config" data-box="sampling-config" data-x="1040" data-y="1100" data-w="650" data-h="110"><rect class="box" x="1040" y="1100" width="650" height="110"/>
<text x="1365" y="1155">采样与上报参数配置</text>
</g>
<path class="link" data-from="adaptive-sampling" data-to="sampling-config" d="M1365,1000 V1100"/>
<g id="freeze" data-box="freeze" data-x="560" data-y="1500" data-w="680" data-h="110"><rect class="box" x="560" y="1500" width="680" height="110"/>
<text x="900" y="1555">调参试验与参数冻结</text>
</g>
<path class="link main" data-from="warning" data-to="freeze" d="M520,1230 V1350 H760 V1500"/>
<path class="link" data-from="sampling-config" data-to="freeze" d="M1365,1210 V1350 H1040 V1500"/>
<g id="validation" data-box="validation" data-x="560" data-y="1690" data-w="680" data-h="110"><rect class="box" x="560" y="1690" width="680" height="110"/>
<text x="900" y="1745">独立批次台架验证</text>
</g>
<path class="link main" data-from="freeze" data-to="validation" d="M900,1610 V1690"/>
<g id="bench" data-box="bench" data-x="90" data-y="1690" data-w="370" data-h="110"><rect class="box" x="90" y="1690" width="370" height="110"/>
<text x="275" y="1745">双支路台架对照</text>
</g>
<g id="measurement-records" data-box="measurement-records" data-x="1330" data-y="1675" data-w="370" data-h="140"><rect class="box" x="1330" y="1675" width="370" height="140"/>
<text x="1515" y="1720">独立计量</text>
<text x="1515" y="1775">与操作记录</text>
</g>
<path class="link" data-from="bench" data-to="validation" d="M460,1745 H560"/>
<path class="link" data-from="measurement-records" data-to="validation" d="M1330,1745 H1240"/>
<g id="comparison" data-box="comparison" data-x="560" data-y="1870" data-w="680" data-h="110"><rect class="box" x="560" y="1870" width="680" height="110"/>
<text x="900" y="1925">基线与策略对照评价</text>
</g>
<path class="link main" data-from="validation" data-to="comparison" d="M900,1800 V1870"/>
<g id="baselines" data-box="baselines" data-x="90" data-y="1855" data-w="370" data-h="140"><rect class="box" x="90" y="1855" width="370" height="140"/>
<text x="275" y="1900">单阈值基线</text>
<text x="275" y="1955">固定采样基线</text>
</g>
<path class="link" data-from="baselines" data-to="comparison" d="M460,1925 H560"/>
<g id="boundaries" data-box="boundaries" data-x="1290" data-y="1855" data-w="440" data-h="140"><rect class="box primary" x="1290" y="1855" width="440" height="140"/>
<text x="1510" y="1900" class="key">可检边界与适用条件</text>
<text x="1510" y="1955">检出/误报/时延/开销</text>
</g>
<path class="link main" data-from="comparison" data-to="boundaries" d="M1240,1925 H1290"/>
</svg>