<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2270" viewBox="0 0 1800 2270" data-print-width-mm="150" role="img" aria-labelledby="title desc">
<title id="title">南疆棉田滴灌支管异常识别技术路线</title>
<desc id="desc">拟开展的研究路线。故障及正常扰动水力建模形成压力流量和阻力特征并开展敏感性分析。独立健康工况测量经时序对齐、连续计数、标定及误差分析形成健康参照和残差尺度。二者输入归一化残差和不重叠块特征，采用块级CUSUM及切换复判。诊断判据支撑异常候选的可靠告警研究，也作为固定采样与事件触发采样对照的统一判据。事件身份关联观测快照，LoRa采用有限重发、去重和持久化后确认，配合人工复测。两条研究线在参数冻结前汇合，随后开展双支路留出批次验证和基线比较，研究检出、误报、时延、送达、开销和可检边界。图示研究计划，不表示实测结果已经取得。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#252525"/></marker>
<style>
text{font-family:SimSun,"Times New Roman",serif;font-size:41px;fill:#151515;text-anchor:middle;dominant-baseline:central}
.title{font-size:44px;font-weight:700}.heading{font-size:42px;font-weight:700}.core-title{font-size:46px;font-weight:700}
.box{fill:#fff;stroke:#353535;stroke-width:1.7}.input{stroke:#505050;stroke-width:1.5}
.core{fill:#eeeeee;stroke:#202020;stroke-width:2.6}.result{fill:#f6f6f6;stroke:#353535;stroke-width:1.9}
.link{fill:none;stroke:#303030;stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}.main{stroke-width:2.1}
.rule{stroke:#aaaaaa;stroke-width:1.1}
</style></defs><rect width="1800" height="2270" fill="#fff"/>
<text x="490" y="50" class="title">故障与正常扰动建模</text>
<text x="1370" y="50" class="title">同步测量与健康标定</text>
<path class="rule" d="M60,85 H920 M1020,85 H1720"/>
<g id="leak" data-box="leak" data-x="60" data-y="120" data-w="250" data-h="90"><rect class="box input" x="60" y="120" width="250" height="90" rx="14"/>
<text x="185" y="165">等效泄漏</text>
</g>
<g id="restriction" data-box="restriction" data-x="365" data-y="120" data-w="250" data-h="90"><rect class="box input" x="365" y="120" width="250" height="90" rx="14"/>
<text x="490" y="165">区段受限</text>
</g>
<g id="disturbance" data-box="disturbance" data-x="670" data-y="120" data-w="250" data-h="90"><rect class="box input" x="670" y="120" width="250" height="90" rx="14"/>
<text x="795" y="165">供压/切换</text>
</g>
<g id="model" data-box="model" data-x="170" data-y="280" data-w="640" data-h="110"><rect class="box" x="170" y="280" width="640" height="110"/>
<text x="490" y="335">故障与扰动水力建模</text>
</g>
<path class="link" data-from="leak" data-to="model" d="M185,210 V245 H350 V280"/>
<path class="link" data-from="restriction" data-to="model" d="M490,210 V280"/>
<path class="link" data-from="disturbance" data-to="model" d="M795,210 V245 H630 V280"/>
<g id="pressure-flow" data-box="pressure-flow" data-x="60" data-y="450" data-w="400" data-h="90"><rect class="box" x="60" y="450" width="400" height="90"/>
<text x="260" y="495">压力—流量特征</text>
</g>
<g id="resistance" data-box="resistance" data-x="520" data-y="450" data-w="400" data-h="90"><rect class="box" x="520" y="450" width="400" height="90"/>
<text x="720" y="495">区段阻力特征</text>
</g>
<path class="link" data-from="model" data-to="pressure-flow" d="M490,390 V420 H260 V450"/>
<path class="link" data-from="model" data-to="resistance" d="M490,390 V420 H720 V450"/>
<g id="sensitivity" data-box="sensitivity" data-x="170" data-y="620" data-w="640" data-h="90"><rect class="box" x="170" y="620" width="640" height="90"/>
<text x="490" y="665">特征敏感性与扰动分析</text>
</g>
<path class="link" data-from="pressure-flow" data-to="sensitivity" d="M260,540 V580 H350 V620"/>
<path class="link" data-from="resistance" data-to="sensitivity" d="M720,540 V580 H630 V620"/>
<g id="pressure" data-box="pressure" data-x="1020" data-y="120" data-w="300" data-h="90"><rect class="box input" x="1020" y="120" width="300" height="90" rx="14"/>
<text x="1170" y="165">压力/压差</text>
</g>
<g id="flow" data-box="flow" data-x="1420" data-y="120" data-w="300" data-h="90"><rect class="box input" x="1420" y="120" width="300" height="90" rx="14"/>
<text x="1570" y="165">流量脉冲</text>
</g>
