<g id="cusum" data-box="cusum" data-x="470" data-y="950" data-w="860" data-h="140"><rect class="box core" x="470" y="950" width="860" height="140"/>
<text x="900" y="995" class="core-title">块级 CUSUM 累积判断</text>
<text x="900" y="1050">切换工况挂起与复判</text>
</g>
<path class="link main" data-from="blocks" data-to="cusum" d="M900,890 V950"/>
<g id="candidate" data-box="candidate" data-x="90" data-y="1150" data-w="700" data-h="140"><rect class="box" x="90" y="1150" width="700" height="140"/>
<text x="440" y="1195" class="heading">持续异常候选</text>
<text x="440" y="1250">观测记录与事件关联</text>
</g>
<g id="sampling" data-box="sampling" data-x="1010" data-y="1150" data-w="700" data-h="140"><rect class="box" x="1010" y="1150" width="700" height="140"/>
<text x="1360" y="1195" class="heading">采集策略研究</text>
<text x="1360" y="1250">保持统一诊断判据</text>
</g>
<path class="link main" data-from="cusum" data-to="candidate" d="M900,1090 V1120 H440 V1150"/>
<path class="link" data-from="cusum" data-to="sampling" d="M900,1090 V1120 H1360 V1150"/>
<g id="delivery" data-box="delivery" data-x="90" data-y="1350" data-w="700" data-h="90"><rect class="box" x="90" y="1350" width="700" height="90"/>
<text x="440" y="1395">LoRa重发、去重与提交后确认</text>
</g>
<path class="link main" data-from="candidate" data-to="delivery" d="M440,1290 V1350"/>
<g id="fixed" data-box="fixed" data-x="1010" data-y="1350" data-w="310" data-h="90"><rect class="box input" x="1010" y="1350" width="310" height="90" rx="14"/>
