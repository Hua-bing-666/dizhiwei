</g>
<path class="link" data-from="alignment" data-to="calibration" d="M1370,390 V450"/>
<g id="reference" data-box="reference" data-x="1040" data-y="620" data-w="660" data-h="90"><rect class="box" x="1040" y="620" width="660" height="90"/>
