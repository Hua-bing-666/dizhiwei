<g id="baselines" data-box="baselines" data-x="60" data-y="2090" data-w="340" data-h="140"><rect class="box" x="60" y="2090" width="340" height="140"/>
<text x="230" y="2135" class="heading">单阈值基线</text>
<text x="230" y="2190">固定采样基线</text>
</g>
<path class="link" data-from="baselines" data-to="comparison" d="M400,2160 H500"/>
<g id="outcome" data-box="outcome" data-x="1400" data-y="2090" data-w="340" data-h="140"><rect class="box result" x="1400" y="2090" width="340" height="140"/>
<text x="1570" y="2135" class="heading">可检边界</text>
