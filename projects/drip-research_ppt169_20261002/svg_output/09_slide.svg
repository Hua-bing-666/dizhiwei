<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">拟实现系统｜网站当前为模型展示</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">由原始采集走向可追踪的系统</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">研究计划：实物、真实无线和田间证据尚未完成；所有指标及扩展按正式任务书冻结。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">09 / 15</text><g id="system-chain" data-pptx-bounds="48 175 1184 467"><rect x="48" y="239" width="263" height="147" rx="0" fill="#EEF3EF" stroke="none" /><text x="68" y="289" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">原始采集</text><text x="68" y="339" font-size="24" fill="#20332F" text-anchor="start">压力 / 流量</text><line x1="311" y1="312" x2="353" y2="312" stroke="#164C45" stroke-width="3" /><rect x="355" y="239" width="263" height="147" rx="0" fill="#EEF3EF" stroke="none" /><text x="375" y="289" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">本地节点</text><text x="375" y="339" font-size="24" fill="#20332F" text-anchor="start">检测 + 缓存</text><line x1="618" y1="312" x2="660" y2="312" stroke="#164C45" stroke-width="3" /><rect x="662" y="239" width="263" height="147" rx="0" fill="#EEF3EF" stroke="none" /><text x="682" y="289" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">LoRa链路</text><text x="682" y="339" font-size="24" fill="#20332F" text-anchor="start">发送 + ACK</text><line x1="925" y1="312" x2="967" y2="312" stroke="#164C45" stroke-width="3" /><rect x="969" y="239" width="263" height="147" rx="0" fill="#EEF3EF" stroke="none" /><text x="989" y="289" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">接收软件</text><text x="989" y="339" font-size="24" fill="#20332F" text-anchor="start">日志 + 回放</text><text x="48" y="461" font-size="24" fill="#20332F">记录字段：启动会话、序号、时间、测量、状态、事件ID。</text><text x="48" y="518" font-size="24" fill="#20332F">工程检查：超时、去重、掉电恢复、缓存溢出与断链恢复。</text><text x="48" y="592" font-size="28" fill="#164C45">先有线数据 → 再可靠无线 → 再有许可的现场适应性。</text></g></svg>
