<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><defs><linearGradient id="deep-field" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#164C45" /><stop offset="100%" stop-color="#092E2B" /></linearGradient></defs><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><rect id="header-mark" data-pptx-role="decoration" x="48" y="35" width="8" height="19" rx="0" fill="#164C45" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="68" y="51" font-size="16" fill="#556762">滴智卫 / 创新训练申报</text><text id="page-route-0" data-pptx-role="header" x="878" y="49" font-size="16" fill="#556762">场景</text><text id="page-route-1" data-pptx-role="header" x="961" y="49" font-size="16" fill="#556762">系统</text><text id="page-route-2" data-pptx-role="header" x="1044" y="49" font-size="16" fill="#556762">证据</text><rect id="route-highlight" data-pptx-role="decoration" x="1114" y="27" width="65" height="31" rx="4" fill="#EEF3EF" stroke="none" /><text id="page-route-3" data-pptx-role="header" x="1127" y="49" font-size="16" fill="#164C45">实施</text><g id="page-title" data-pptx-bounds="48 82 1184 78"><text x="48" y="126" font-size="42" fill="#164C45" text-anchor="start" font-weight="bold">用独立实验兑现研究目标</text></g><text id="source-footer" data-pptx-role="footer" x="48" y="686" font-size="16" fill="#556762">实验数量与供压为设计网格，实际范围须按仪器/水路条件核定</text><text id="page-number" data-pptx-role="page-number" x="1232" y="686" text-anchor="end" font-size="16" fill="#556762">10/15</text><g id="experiment-total" data-pptx-bounds="48 162 419 392"><text x="48" y="192" font-size="28" fill="#164C45" text-anchor="start" font-weight="bold">主要故障实验网格（计划）</text><text x="48" y="239" font-size="24" fill="#20332F" text-anchor="start">2类型 × 3供压 × 3程度 × 3独立操作</text><text x="48" y="326" font-size="72" fill="#164C45" text-anchor="start" font-weight="bold">≥54</te