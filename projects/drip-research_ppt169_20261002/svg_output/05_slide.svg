ke-width="6" /><line x1="304" y1="388" x2="1150" y2="388" stroke="#164C45" stroke-width="6" /><rect x="87" y="265" width="128" height="58" rx="6" fill="#EEF3EF" stroke="#164C45" /><text x="151" y="300" font-size="20" fill="#164C45" text-anchor="middle">共同供水</text><rect x="474" y="231" width="91" height="44" rx="5" fill="#F6ECE6" stroke="#B4512B" /><text x="519" y="259" font-size="18" fill="#B4512B" text-anchor="middle">受限元件</text><circle cx="393" cy="253" r="25" fill="#FAF9F5" stroke="#164C45" stroke-width="3" /><text x="393" y="260" font-size="20" fill="#164C45" text-anchor="middle" font-weight="bold">P0</text><circle cx="676" cy="253" r="25" fill="#FAF9F5" stroke="#164C45" stroke-width="3" /><text x="676" y="260" font-size="20" fill="#164C45" text-anchor="middle" font-weight="bold">P1</text><circle cx="838" cy="253" r="25" fill="#FAF9F5" stroke="#164C45" stroke-width="3" /><text x="838" y="260" font-size="20" fill="#164C45" text-anchor="middle" font-weight="bold">Q</text><text x="393" y="208" font-size="18" fill="#556762" text-anchor="middle">区段入口</text><text x="676" y="208" font-size="18" fill="#556762" text-anchor="middle">受限下游</text><text x="838" y="208" font-size="18" fill="#556762" text-anchor="middle">支管总流量</text><line x1="941" y1="253" x2="941" y2="321" stroke="#B4512B" stroke-width="3" /><line x1="941" y1="321" x2="1103" y2="321" stroke="#B4512B" stroke-width="3" /><text x="1114" y="329" font-size="18" fill="#B4512B" text-anchor="start">泄漏</text><rect x="1065" y="232" width="97" height="42" rx="4" fill="#EEF3EF" stroke="none" /><text x="1113" y="260" font-size="18" fill="#164C45" text-anchor="middle">A负载</text><rect x="543" y="367" width="109" height="42" rx="4" fill="#EEF3EF" stroke="#164C45" /><text x="597" y="396" font-size="18" fill="#164C45" text-anchor="middle">切换阀</text><rect x="1065" y="367" width="97" height="42" rx="4" fill="#EEF3EF" stroke="none" /><text x="1113" y="396" font-size="18" fill="#164C45" text-anchor="middle">B负载</text><text x="86" y="433" font-size="20" fill="#164C45" text-anchor="start">P0/P1包围目标受限区段；Q包含负载与泄漏旁路总流量。</text></g><g id="diagnostic-features" data-pptx-bounds="48 475 1184 180"><rect x="48" y="480" width="391" height="115" rx="6" fill="#EEF3EF" stroke="none" /><text x="68" y="513" font-size="20" fill="#164C45" text-anchor="start" font-weight="bold">负载特征 K</text><text x="68" y="559" font-size="28" fill="#164C45" text-anchor="start">Q / √P1</text><rect x="462" y="480" width="391" height="115" rx="6" fill="#EEF3EF" stroke="none" /><text x="482" y="513" font-size="20" fill="#164C45" text-anchor="start" font-weight="bold">阻力特征 R估计</text><text x="482" y="559" font-size="28" fill="#164C45" text-anchor="start">(P0 − P1) / Q²</text><rect x="876" y="480" width="356" height="115" rx="6" fill="#F6ECE6" stroke="none" /><text x="896" y="513" font-size="20" fill="#B4512B" text-anchor="start" font-weight="bold">诊断成立条件</text><text x="896" y="549" font-size="20" fill="#20332F">已知操作 / 参考标定<tspan x="896" dy="29">未知负载与漂移仍可能混淆</tspan></text><text x="48" y="639" font-size="24" fill="#164C45">负载假设：<tspan data-pptx-inline-formula="Q=C\sqrt{P_1}">Q = C√P₁</tspan></text><text x="498" y="639" font-size="24" fill="#164C45" text-anchor="start">压降假设：P0 − P1 = R·Q²</text></g></svg>
