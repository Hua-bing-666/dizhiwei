20332F" text-anchor="start">补实验 / 原型与报告 / 结项</text><line x1="48" y1="473" x2="799" y2="473" stroke="#C7D2CB" stroke-width="1" /></g><g id="startup-budget" data-pptx-bounds="834 175 398 458"><rect x="834" y="175" width="398" height="458" rx="0" fill="#EEF3EF" stroke="none" /><text x="861" y="236" font-size="28" fill="#164C45" text-anchor="start">启动额度估算</text><text x="861" y="322" font-size="60" fill="#164C45" text-anchor="start" font-weight="bold">¥2000</text><text fill="#20332F" font-size="24" x="861" y="381">电子无线260；传感450</text><text fill="#20332F" font-size="24" x="861" y="418">水路500；供电外壳250</text><text fill="#20332F" font-size="24" x="861" y="455">记录耗材160；返工380</text><text fill="#556762" font-size="18" x="861" y="559">需借参考仪器；资助后优先扩展实验，</text><text fill="#556762" font-size="18" x="861" y="587">论文费用另核查。</text></g></svg>