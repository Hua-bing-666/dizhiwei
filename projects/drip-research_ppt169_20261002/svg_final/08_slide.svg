<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><defs><linearGradient id="deep-field" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#164C45" /><stop offset="100%" stop-color="#092E2B" /></linearGradient></defs><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="url(#deep-field)" stroke="none" /><rect id="header-mark" data-pptx-role="decoration" x="48" y="35" width="8" height="19" rx="0" fill="#78DFC5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="68" y="51" font-size="16" fill="#B7CCC6">滴智卫 / 创新训练申报</text><text id="page-route-0" data-pptx-role="header" x="878" y="49" font-size="16" fill="#B7CCC6">场景</text><text id="page-route-1" data-pptx-role="header" x="961" y="49" font-size="16" fill="#B7CCC6">系统</text><rect id="route-highlight" data-pptx-role="decoration" x="1031" y="27" width="65" height="31" rx="4" fill="#23554E" stroke="none" /><text id="page-route-2" data-pptx-role="header" x="1044" y="49" font-size="16" fill="#78DFC5">证据</text><text id="page-route-3" data-pptx-role="header" x="1127" y="49" font-size="16" fill="#B7CCC6">实施</text><g id="page-title" data-pptx-bounds="48 82 1184 78"><text x="48" y="126" font-size="42" fill="#FFFFFF" text-anchor="start" font-weight="bold">测点增加，边界仍然存在</text></g><text id="source-footer" data-pptx-role="footer" x="48" y="686" font-size="16" fill="#B7CCC6">6场景 × 4噪声 × 20种子 = 480次合成试验；重复种子不是独立实物实验</text><text id="page-number" data-pptx-role="page-number" x="1232" y="686" text-anchor="end" font-size="16" fill="#B7CCC6">08/15</text><g id="noise-boundary" data-pptx-bounds="48 175 420 472"><text x="48" y="258" font-size="72" fill="#F3C77B" text-anchor="start" font-weight="bold">12/20</text><text x="48" y="302" font-size="28" fill="#FFFFFF" text-anchor="start" font-weight="bold">大噪声下正确提前发现</text><text fill="#D8EAE2" font-size="24" x="48" y="350">两类故障均如此</text><text fill="#D8EAE2" font-size="24" x="48" y="385">压力点噪声σ10kPa</text><text fill="#D8EAE2" font-size="24" x="48" y="420">20个模拟种子，非实物识别率</text><line x1="48" y1="466" x2="451" y2="466" stroke="#46766B" stroke-width="1" /><text fill="#78DFC5" font-weight="bold" font-size="30" x="48" y="511">保留失败记录，</text><text fill="#78DFC5" font-weight="bold" font-size="30" x="48" y="555">据实确定方法的增量。</text></g><g id="failure-mechanisms" data-pptx-bounds="508 175 724 479"><rect x="513" y="181" width="719" height="125" rx="8" fill="#164C45" stroke="none" /><text x="540" y="218" font-size="24" fill="#78DFC5" text-anchor="start" font-weight="bold">压力漂移</text><text x="540" y="264" font-size="24" fill="#FFFFFF">入口压力漂移可误判为局部受限。</text><rect x="513" y="326" width="719" height="125" rx="8" fill="#164C45" stroke="none" /><text x="540" y="363" font-size="24" fill="#78DFC5" text-anchor="start" font-weight="bold">未知负载</text><text x="540" y="409" font-size="24" fill="#FFFFFF">正常负载增大可与等效泄漏同形。</text><rect x="513" y="471" width="719" height="125" rx="8" fill="#164C45" stroke="none" /><text x="540" y="508" font-size="24" fill="#78DFC5" text-anchor="start" font-weight="bold">模型假设</text><text x="540" y="554" font-size="24" fill="#FFFFFF">单故障、同步及平方律不能证明田间泛化。</text><text x="513" y="639" font-size="24" fill="#F3C77B" text-anchor="start">需落实参考标定、状态标签与独立批次实测。</text></g></svg>