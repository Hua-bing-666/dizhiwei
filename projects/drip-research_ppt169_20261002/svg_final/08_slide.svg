<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">新增合成挑战｜非实测</text><text id="page-route-0" data-pptx-role="header" x="790" y="44" font-size="16" fill="#556762">场景</text><text id="page-route-1" data-pptx-role="header" x="883" y="44" font-size="16" fill="#556762">系统</text><text id="page-route-2" data-pptx-role="header" x="976" y="44" font-size="16" fill="#164C45" font-weight="bold">证据</text><text id="page-route-3" data-pptx-role="header" x="1069" y="44" font-size="16" fill="#556762">实施</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">增加测点仍不能消除所有混淆</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">来源：diagnosis_results/summary.json，6场景×4噪声×20种子；合成重复不是实物识别率。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">08 / 15</text><g id="failure-boundaries" data-pptx-bounds="48 175 1184 467"><text x="48" y="260" font-size="60" fill="#B4512B" text-anchor="start" font-weight="bold">12 / 20</text><text x="383" y="250" font-size="30" fill="#164C45" text-anchor="start">大噪声下正确提前发现试次</text><text x="383" y="300" font-size="24" fill="#20332F" text-anchor="start">两类均如此；压力噪声σ10kPa，非实物性能。</text><line x1="48" y1="336" x2="1232" y2="336" stroke="#C7D2CB" stroke-width="1" /><text x="48" y="394" font-size="28" fill="#B4512B" text-anchor="start">测量漂移</text><text x="282" y="394" font-size="24" fill="#20332F" text-anchor="start">入口压力漂移可被误判为局部受限</text><text x="48" y="459" font-size="28" fill="#B4512B" text-anchor="start">状态未知</text><text x="282" y="459" font-size="24" fill="#20332F" text-anchor="start">正常负载增大可与等效泄漏同形</text><text x="48" y="524" font-size="28" fill="#B4512B" text-anchor="start">理想假设</text><text x="282" y="524" font-size="24" fill="#20332F">单故障、同步测量、平方律；不能据此证明田间早期准确率</text><text x="48" y="622" font-size="28" fill="#164C45" text-anchor="start">保留失败案例与强基线，按实际证据确定研究增量。</text></g></svg>
