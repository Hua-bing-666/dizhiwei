<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">布点假设｜未标定</text><text id="page-route-0" data-pptx-role="header" x="790" y="44" font-size="16" fill="#556762">场景</text><text id="page-route-1" data-pptx-role="header" x="883" y="44" font-size="16" fill="#164C45" font-weight="bold">系统</text><text id="page-route-2" data-pptx-role="header" x="976" y="44" font-size="16" fill="#556762">证据</text><text id="page-route-3" data-pptx-role="header" x="1069" y="44" font-size="16" fill="#556762">实施</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">双压力测点为有限诊断补充依据</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">来源：diagnosis_feasibility.py 的布点假设；平方律及负载未标定。设计示意，非样机。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">05 / 15</text><g id="hydraulic-model" data-pptx-bounds="48 175 1184 454"><text x="52" y="216" font-size="28" fill="#164C45" text-anchor="start">共同供水 → 双支路 → P0 / P1 / Q</text><line x1="80" y1="357" x2="360" y2="357" stroke="#164C45" stroke-width="4" /><line x1="360" y1="285" x2="360" y2="493" stroke="#164C45" stroke-width="4" /><line x1="360" y1="285" x2="1050" y2="285" stroke="#164C45" stroke-width="4" /><line x1="360" y1="493" x2="1050" y2="493" stroke="#164C45" stroke-width="4" /><rect x="186" y="330" width="100" height="54" rx="0" fill="#FAF9F5" stroke="#164C45" /><text x="205" y="366" font-size="28" fill="#164C45" text-anchor="start">Rc</text><rect x="458" y="258" width="122" height="54" rx="0" fill="#FAF9F5" stroke="#B4512B" /><text x="475" y="294" font-size="24" fill="#B4512B" text-anchor="start">节流</text><circle cx="403" cy="285" r="26" fill="#FAF9F5" stroke="#426B91" stroke-width="3" /><text x="403" y="294" font-size="24" fill="#426B91" text-anchor="middle">P0</text><circle cx="727" cy="285" r="26" fill="#FAF9F5" stroke="#164C45" stroke-width="3" /><text x="727" y="294" font-size="24" fill="#164C45" text-anchor="middle">P1</text><circle cx="865" cy="285" r="26" fill="#FAF9F5" stroke="#164C45" stroke-width="3" /><text x="865" y="294" font-size="24" fill="#164C45" text-anchor="middle">Q</text><rect x="974" y="250" width="82" height="68" rx="0" fill="#EEF3EF" stroke="#164C45" /><rect x="974" y="459" width="82" height="68" rx="0" fill="#EEF3EF" stroke="#164C45" /><text x="65" y="312" font-size="24" fill="#164C45" text-anchor="start">供压Ps</text><text x="668" y="237" font-size="24" fill="#164C45" text-anchor="start">A下游</text><text x="598" y="452" font-size="24" fill="#164C45" text-anchor="start">B支路切换</text><line x1="924" y1="285" x2="924" y2="365" stroke="#B4512B" stroke-width="2" /><line x1="924" y1="365" x2="1080" y2="365" stroke="#B4512B" stroke-width="2" /><text x="1100" y="372" font-size="24" fill="#B4512B" text-anchor="start">泄漏</text><text x="1081" y="290" font-size="24" fill="#20332F" text-anchor="start">负载</text><text x="1081" y="501" font-size="24" fill="#20332F" text-anchor="start">负载</text><text x="52" y="575" font-size="28" fill="#164C45">负载假设：<tspan data-pptx-inline-formula="Q=C\sqrt{P_1}">Q = C√P₁</tspan></text><text x="526" y="575" font-size="24" fill="#164C45" text-anchor="start">压降假设：P0 − P1 = R·Q²</text><text x="52" y="623" font-size="18" fill="#556762" text-anchor="start">测点间健康压降与差分不确定度必须先标定；图为集中等效模型。</text></g></svg>
