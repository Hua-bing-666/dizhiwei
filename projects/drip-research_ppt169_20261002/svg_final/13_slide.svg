<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" rx="0" fill="#FAF9F5" stroke="none" /><text id="page-kicker" data-pptx-role="header" x="48" y="44" font-size="16" fill="#164C45">测量与辨因边界</text><text id="page-route-0" data-pptx-role="header" x="790" y="44" font-size="16" fill="#556762">场景</text><text id="page-route-1" data-pptx-role="header" x="883" y="44" font-size="16" fill="#556762">系统</text><text id="page-route-2" data-pptx-role="header" x="976" y="44" font-size="16" fill="#164C45" font-weight="bold">证据</text><text id="page-route-3" data-pptx-role="header" x="1069" y="44" font-size="16" fill="#556762">实施</text><g id="page-title" data-pptx-bounds="48 65 1184 95"><text x="48" y="121" font-family="SimHei, Arial" font-size="42" fill="#164C45" text-anchor="start">备用｜诊断只在可辨识条件下成立</text></g><line id="header-rule" data-pptx-role="decoration" x1="48" y1="148" x2="1232" y2="148" stroke="#C7D2CB" stroke-width="1" /><text id="source-footer" data-pptx-role="footer" x="48" y="683" font-size="16" fill="#556762">来源：旧单点结构反例及新增双点模型；辨因依赖布点、操作信息、负载与测量质量。</text><text id="page-number" data-pptx-role="page-number" x="1232" y="44" font-size="16" text-anchor="end" fill="#556762">13 / 15</text><g id="observability-boundary" data-pptx-bounds="48 175 1184 467"><text x="48" y="255" font-family="SimHei, Arial" font-size="42" fill="#B4512B" text-anchor="start">相同压力 / 流量 ≠ 相同故障原因</text><text x="48" y="335" font-size="28" fill="#20332F">上游节流与供压下降可映射到相同测点观测。</text><text x="48" y="418" font-size="28" fill="#164C45">新增P0可有条件改善；未知正常负载仍与泄漏同形。</text><text x="48" y="504" font-size="24" fill="#20332F">位置只到监测支管区段；输出模式、待检查或数据无效。</text><text x="48" y="602" font-size="28" fill="#164C45" text-anchor="start">成立条件：信号可观测、参考可标定、操作可重复。</text></g></svg>
